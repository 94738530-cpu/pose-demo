<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>人体 X 光解剖骨架 V1.8</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101010;color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif
}
header{
  position:sticky;top:0;z-index:20;background:#171717;
  border-bottom:1px solid #333;padding:11px 12px
}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:11px;color:#aaa;line-height:1.45}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
button,.file{
  border:1px solid #555;background:#292929;color:#eee;
  border-radius:9px;padding:8px 10px;font-size:12px
}
button:disabled{opacity:.4}
.file input{display:none}
main{
  display:grid;grid-template-columns:minmax(0,1fr) 320px;
  gap:10px;padding:10px;max-width:1500px;margin:auto
}
.viewer{
  background:#050505;border:1px solid #333;border-radius:12px;
  overflow:auto;min-height:62vh;padding:10px;
  display:flex;align-items:flex-start;justify-content:center
}
#empty{margin:auto;color:#888;text-align:center;line-height:1.8}
#stage{position:relative;display:none;line-height:0;margin:auto}
#img{display:block;max-width:100%;height:auto}
#overlay{position:absolute;left:0;top:0;pointer-events:none}
.panel{
  background:#191919;border:1px solid #333;border-radius:12px;padding:11px
}
.panel h2{font-size:14px;margin:0 0 8px}
.note{
  background:#222;border-radius:9px;padding:9px;
  font-size:11px;line-height:1.55;margin:8px 0
}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}
.row input[type=range]{flex:1}
#status{white-space:pre-wrap;font-size:11px;line-height:1.55;color:#bbb}
.ok{color:#91db9a}.bad{color:#ff8585}
.legend{font-size:10px;color:#999;line-height:1.55}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .panel{order:2}
  .viewer{min-height:48vh}
}
</style>
</head>

<body>

<header>
<h1>人体 X 光解剖骨架 V1.8</h1>
<div class="sub">
真实关节链驱动 · 胸廓 · 脊柱 · 骨盆 · 耻骨参考
</div>

<div class="toolbar">

<label class="file">
打开人物图
<input id="file" type="file" accept="image/*">
</label>

<button id="detect" disabled>开始检测</button>
<button id="original" disabled>原图</button>
<button id="xr" disabled>X 光</button>
<button id="boneOnly" disabled>仅骨架</button>
<button id="points" disabled>检测点</button>

</div>
</header>

<main>

<section class="viewer">

<div id="empty">先打开一张人物图片</div>

<div id="stage">
<img id="img">
<canvas id="overlay"></canvas>
</div>

</section>

<aside class="panel">

<h2>V1.8 骨架检测</h2>

<div id="status">等待图片。</div>

<div class="note">
<b>本版核心</b><br>
① 四肢严格沿真实关节链。<br>
② 肱骨、前臂、股骨、小腿独立计算。<br>
③ 髋关节作为股骨真正起点。<br>
④ 膝关节作为明确转折点。<br>
⑤ 胸廓由肩带与骨盆之间建立。<br>
⑥ 骨盆围绕左右髋关节建立。<br>
⑦ 耻骨只作为结构参考，不伪装成真实检测点。
</div>

<div class="row">
<label>人物透明度</label>
<input id="photoOpacity" type="range" min="10" max="100" value="55">
</div>

<div class="row">
<label>骨架强度</label>
<input id="boneOpacity" type="range" min="20" max="100" value="90">
</div>

<div class="legend">
白色：主要骨骼<br>
青色：解剖结构参考<br>
红点：高可信姿态点<br>
黄点：较低可信姿态点<br><br>

重要：MediaPipe 33 点不是医学骨点。
胸骨、肋骨、骨盆、耻骨等为姿态驱动的结构推导。
</div>

</aside>
</main>


<script type="module">

const $=id=>document.getElementById(id);

const img=$("img");
const canvas=$("overlay");
const ctx=canvas.getContext("2d");

const stage=$("stage");
const empty=$("empty");
const status=$("status");

let W=0;
let H=0;
let landmarks=null;
let detector=null;
let showPoints=false;
let displayMode="xr";


/* =========================================================
   数学
========================================================= */

function P(i){
  return landmarks?.[i]||null;
}

function mid(a,b){
  return{
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function unit(a,b){
  const dx=b.x-a.x;
  const dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  return{x:dx/d,y:dy/d};
}

function perp(v){
  return{x:-v.y,y:v.x};
}

function add(a,v,s){
  return{
    x:a.x+v.x*s,
    y:a.y+v.y*s
  };
}

function lerp(a,b,t){
  return{
    x:a.x+(b.x-a.x)*t,
    y:a.y+(b.y-a.y)*t
  };
}


/* =========================================================
   绘图
========================================================= */

function line(a,b,w,color){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.lineWidth=w;
  ctx.strokeStyle=color;
  ctx.stroke();
}

function circle(p,r,fill,stroke=""){
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.lineWidth=1;
    ctx.strokeStyle=stroke;
    ctx.stroke();
  }
}

function capsule(a,b,r1,r2,fill){

  const u=unit(a,b);
  const n=perp(u);

  ctx.beginPath();

  ctx.moveTo(
    a.x+n.x*r1,
    a.y+n.y*r1
  );

  ctx.lineTo(
    b.x+n.x*r2,
    b.y+n.y*r2
  );

  ctx.lineTo(
    b.x-n.x*r2,
    b.y-n.y*r2
  );

  ctx.lineTo(
    a.x-n.x*r1,
    a.y-n.y*r1
  );

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();
}

function ellipse(p,rx,ry,rotation,fill,stroke=""){

  ctx.beginPath();

  ctx.ellipse(
    p.x,p.y,rx,ry,rotation,0,Math.PI*2
  );

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.lineWidth=1;
    ctx.strokeStyle=stroke;
    ctx.stroke();
  }
}

function arc(p,rx,ry,rotation,start,end,width,color){

  ctx.beginPath();

  ctx.ellipse(
    p.x,p.y,rx,ry,rotation,start,end
  );

  ctx.lineWidth=width;
  ctx.strokeStyle=color;
  ctx.stroke();
}


/* =========================================================
   V1.8
   真实关节链
========================================================= */

function drawSkeleton(){

  const nose=P(0);

  const earL=P(7);
  const earR=P(8);

  const shoulderL=P(11);
  const shoulderR=P(12);

  const elbowL=P(13);
  const elbowR=P(14);

  const wristL=P(15);
  const wristR=P(16);

  const hipL=P(23);
  const hipR=P(24);

  const kneeL=P(25);
  const kneeR=P(26);

  const ankleL=P(27);
  const ankleR=P(28);

  const heelL=P(29);
  const heelR=P(30);

  const toeL=P(31);
  const toeR=P(32);


  if(
    !shoulderL||
    !shoulderR||
    !hipL||
    !hipR
  )return;


  /* =======================================================
     身体基准
  ======================================================= */

  const shoulderCenter=
    mid(shoulderL,shoulderR);

  const hipCenter=
    mid(hipL,hipR);

  const shoulderWidth=
    dist(shoulderL,shoulderR);

  const hipWidth=
    dist(hipL,hipR);

  const torsoLength=
    dist(
      shoulderCenter,
      hipCenter
    );

  const torsoAxis=
    unit(
      shoulderCenter,
      hipCenter
    );

  const torsoSide=
    perp(torsoAxis);

  const rotation=
    Math.atan2(
      torsoAxis.y,
      torsoAxis.x
    );


  const main=
    "rgba(238,253,255,.94)";

  const bright=
    "rgba(195,249,255,.98)";

  const detail=
    "rgba(100,225,245,.74)";

  const soft=
    "rgba(170,245,255,.045)";


  ctx.save();

  ctx.globalAlpha=
    Number(
      $("boneOpacity").value
    )/100;

  ctx.shadowBlur=6;

  ctx.shadowColor=
    "rgba(70,225,255,.55)";


  /* =======================================================
     头骨
  ======================================================= */

  let headCenter;

  if(earL&&earR){
    headCenter=mid(earL,earR);
  }
  else if(nose){
    headCenter={
      x:nose.x,
      y:nose.y-shoulderWidth*.15
    };
  }
  else{
    headCenter={
      x:shoulderCenter.x,
      y:shoulderCenter.y-shoulderWidth*.25
    };
  }


  const headWidth=
    earL&&earR
      ? dist(earL,earR)
      : shoulderWidth*.18;


  const headRot=
    earL&&earR
      ? Math.atan2(
          earR.y-earL.y,
          earR.x-earL.x
        )
      : 0;


  ellipse(
    headCenter,
    headWidth*.76,
    headWidth*.98,
    headRot,
    soft,
    bright
  );


  if(nose){

    line(
      headCenter,
      nose,
      Math.max(
        1.2,
        shoulderWidth*.009
      ),
      detail
    );

  }


  /* =======================================================
     肩带
  ======================================================= */

  line(
    shoulderL,
    shoulderCenter,
    Math.max(
      2,
      shoulderWidth*.016
    ),
    bright
  );

  line(
    shoulderCenter,
    shoulderR,
    Math.max(
      2,
      shoulderWidth*.016
    ),
    bright
  );


  /* =======================================================
     肱骨
  ======================================================= */

  if(elbowL){

    capsule(
      shoulderL,
      elbowL,
      shoulderWidth*.038,
      shoulderWidth*.026,
      main
    );

  }

  if(elbowR){

    capsule(
      shoulderR,
      elbowR,
      shoulderWidth*.038,
      shoulderWidth*.026,
      main
    );

  }


  /* =======================================================
     前臂
  ======================================================= */

  if(elbowL&&wristL){

    capsule(
      elbowL,
      wristL,
      shoulderWidth*.028,
      shoulderWidth*.018,
      main
    );

  }

  if(elbowR&&wristR){

    capsule(
      elbowR,
      wristR,
      shoulderWidth*.028,
      shoulderWidth*.018,
      main
    );

  }


  /* 肘关节 */

  if(elbowL){
    circle(
      elbowL,
      shoulderWidth*.025,
      "rgba(240,255,255,.72)"
    );
  }

  if(elbowR){
    circle(
      elbowR,
      shoulderWidth*.025,
      "rgba(240,255,255,.72)"
    );
  }


  /* =======================================================
     胸廓
  ======================================================= */

  const ribTop=
    lerp(
      shoulderCenter,
      hipCenter,
      .10
    );

  const ribBottom=
    lerp(
      shoulderCenter,
      hipCenter,
      .62
    );


  const ribCount=8;


  for(let i=0;i<ribCount;i++){

    const t=
      i/(ribCount-1);

    const center=
      lerp(
        ribTop,
        ribBottom,
        t
      );


    const width=
      shoulderWidth*
      (
        .40 -
        .025*t
      );


    const height=
      torsoLength*.027;


    const left=
      add(
        center,
        torsoSide,
        -width
      );

    const right=
      add(
        center,
        torsoSide,
        width
      );


    const sternum=
      center;


    ctx.beginPath();

    ctx.moveTo(
      left.x,
      left.y
    );

    ctx.quadraticCurveTo(
      sternum.x,
      sternum.y-height,
      right.x,
      right.y
    );

    ctx.lineWidth=
      Math.max(
        1.2,
        shoulderWidth*.007
      );

    ctx.strokeStyle=detail;
    ctx.stroke();

  }


  /* =======================================================
     胸骨
  ======================================================= */

  const sternumTop=
    lerp(
      shoulderCenter,
      hipCenter,
      .11
    );

  const sternumBottom=
    lerp(
      shoulderCenter,
      hipCenter,
      .62
    );


  capsule(
    sternumTop,
    sternumBottom,
    shoulderWidth*.010,
    shoulderWidth*.008,
    main
  );


  /* =======================================================
     脊柱
  ======================================================= */

  const spine=[];


  for(let i=0;i<=13;i++){

    spine.push(
      lerp(
        shoulderCenter,
        hipCenter,
        .08+i*.068
      )
    );

  }


  for(let i=0;i<spine.length-1;i++){

    capsule(
      spine[i],
      spine[i+1],
      Math.max(
        1,
        shoulderWidth*.010
      ),
      Math.max(
        1,
        shoulderWidth*.009
      ),
      main
    );

    circle(
      spine[i],
      Math.max(
        1.2,
        shoulderWidth*.014
      ),
      "rgba(245,255,255,.60)"
    );

  }


  /* =======================================================
     骨盆
  ======================================================= */

  /*
     不再画一个大椭圆。
     左右髋关节是骨盆的真实输入。
  */

  const pelvisAxis=
    unit(
      hipL,
      hipR
    );

  const pelvisNormal=
    perp(pelvisAxis);


  const pelvisTopL=
    add(
      hipL,
      torsoAxis,
      -hipWidth*.12
    );

  const pelvisTopR=
    add(
      hipR,
      torsoAxis,
      -hipWidth*.12
    );


  const pelvisLowerL=
    add(
      hipL,
      torsoAxis,
      hipWidth*.18
    );

  const pelvisLowerR=
    add(
      hipR,
      torsoAxis,
      hipWidth*.18
    );


  /* 髂骨上缘 */

  line(
    pelvisTopL,
    pelvisTopR,
    Math.max(
      2,
      hipWidth*.015
    ),
    bright
  );


  /* 左髂骨 */

  line(
    pelvisTopL,
    pelvisLowerL,
    Math.max(
      2,
      hipWidth*.016
    ),
    bright
  );


  /* 右髂骨 */

  line(
    pelvisTopR,
    pelvisLowerR,
    Math.max(
      2,
      hipWidth*.016
    ),
    bright
  );


  /* =======================================================
     骨盆下弓
  ======================================================= */

  const pubicBase=
    mid(
      pelvisLowerL,
      pelvisLowerR
    );


  arc(
    pubicBase,
    hipWidth*.43,
    torsoLength*.09,
    rotation,
    0,
    Math.PI,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    detail
  );


  /* =======================================================
     耻骨参考
  ======================================================= */

  const pubic=
    lerp(
      hipCenter,
      pubicBase,
      .72
    );


  circle(
    pubic,
    Math.max(
      2.5,
      hipWidth*.024
    ),
    "rgba(255,255,255,.90)"
  );


  line(
    pelvisLowerL,
    pubic,
    Math.max(
      1.3,
      hipWidth*.009
    ),
    detail
  );

  line(
    pelvisLowerR,
    pubic,
    Math.max(
      1.3,
      hipWidth*.009
    ),
    detail
  );


  /* =======================================================
     股骨
  ======================================================= */

  if(kneeL){

    capsule(
      hipL,
      kneeL,
      hipWidth*.046,
      hipWidth*.032,
      main
    );

  }

  if(kneeR){

    capsule(
      hipR,
      kneeR,
      hipWidth*.046,
      hipWidth*.032,
      main
    );

  }


  /* =======================================================
     膝关节
  ======================================================= */

  if(kneeL){

    circle(
      kneeL,
      hipWidth*.031,
      "rgba(240,255,255,.75)"
    );

  }

  if(kneeR){

    circle(
      kneeR,
      hipWidth*.031,
      "rgba(240,255,255,.75)"
    );

  }


  /* =======================================================
     小腿
  ======================================================= */

  if(kneeL&&ankleL){

    capsule(
      kneeL,
      ankleL,
      hipWidth*.033,
      hipWidth*.022,
      main
    );

  }

  if(kneeR&&ankleR){

    capsule(
      kneeR,
      ankleR,
      hipWidth*.033,
      hipWidth*.022,
      main
    );

  }


  /* =======================================================
     足部
  ======================================================= */

  if(ankleL&&toeL){

    capsule(
      ankleL,
      toeL,
      hipWidth*.023,
      hipWidth*.013,
      main
    );

  }
  else if(heelL&&toeL){

    capsule(
      heelL,
      toeL,
      hipWidth*.023,
      hipWidth*.013,
      main
    );

  }


  if(ankleR&&toeR){

    capsule(
      ankleR,
      toeR,
      hipWidth*.023,
      hipWidth*.013,
      main
    );

  }
  else if(heelR&&toeR){

    capsule(
      heelR,
      toeR,
      hipWidth*.023,
      hipWidth*.013,
      main
    );

  }


  ctx.restore();

}


/* =========================================================
   检测点
========================================================= */

function drawPoints(){

  if(!landmarks)return;

  ctx.save();

  landmarks.forEach(p=>{

    if((p.v??1)<.35)return;

    circle(
      p,
      Math.max(
        3,
        W*.0027
      ),
      (p.v??1)>=.7
        ?"rgba(255,77,93,.95)"
        :"rgba(255,211,92,.95)"
    );

  });

  ctx.restore();

}


/* =========================================================
   总绘制
========================================================= */

function draw(){

  if(!W)return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(!landmarks){

    img.style.opacity=1;

    return;

  }


  if(displayMode==="bone"){

    img.style.opacity=0;

  }
  else{

    img.style.opacity=
      Number(
        $("photoOpacity").value
      )/100;

  }


  drawSkeleton();


  if(showPoints){
    drawPoints();
  }

}


/* =========================================================
   尺寸
========================================================= */

function resizeCanvas(){

  if(!W)return;

  canvas.width=W;
  canvas.height=H;

  canvas.style.width=
    img.clientWidth+"px";

  canvas.style.height=
    img.clientHeight+"px";

  draw();

}

new ResizeObserver(
  resizeCanvas
).observe(img);


/* =========================================================
   图片
========================================================= */

$("file").onchange=e=>{

  const file=e.target.files?.[0];

  if(!file)return;


  const url=
    URL.createObjectURL(file);


  img.onload=()=>{

    W=img.naturalWidth;
    H=img.naturalHeight;

    stage.style.display=
      "inline-block";

    empty.style.display=
      "none";


    landmarks=null;

    enableButtons(false);

    $("detect").disabled=false;

    displayMode="xr";

    img.style.opacity=1;


    ctx.clearRect(
      0,0,W,H
    );


    setStatus(
      `图片已载入：${W} × ${H}
点击“开始检测”。`
    );


    URL.revokeObjectURL(url);

    resizeCanvas();

  };


  img.src=url;

};


/* =========================================================
   MediaPipe
========================================================= */

async function loadMediaPipe(){

  setStatus(
    `正在加载 MediaPipe…
首次加载模型可能需要一点时间。`
  );


  const {
    PoseLandmarker,
    FilesetResolver
  }=await import(
    "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs"
  );


  const vision=
    await FilesetResolver.forVisionTasks(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
    );


  detector=
    await PoseLandmarker.createFromOptions(
      vision,
      {

        baseOptions:{
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
        },

        runningMode:"IMAGE",

        numPoses:1,

        minPoseDetectionConfidence:.5,

        minPosePresenceConfidence:.5,

        minTrackingConfidence:.5

      }
    );

}


/* =========================================================
   检测
========================================================= */

$("detect").onclick=
async()=>{

  if(!W)return;

  $("detect").disabled=true;


  try{

    if(!detector){
      await loadMediaPipe();
    }


    const result=
      detector.detect(img);


    if(!result.landmarks?.length){

      landmarks=null;

      draw();

      enableButtons(false);

      $("detect").disabled=false;


      setStatus(
        `❌ 没有检测到人物。
没有检测到人物就不画假骨架。`,
        "bad"
      );

      return;

    }


    landmarks=
      result.landmarks[0]
      .map((p,i)=>({

        x:p.x*W,
        y:p.y*H,
        z:p.z,
        v:p.visibility??1,
        i

      }));


    enableButtons(true);


    setStatus(
      `✅ 检测完成：1 人物 / 33 个姿态点

V1.8 真实关节链已建立。

重点检查：
肩 → 肘 → 腕
髋 → 膝 → 踝
胸廓 → 脊柱 → 骨盆
以及耻骨参考区域。`,
      "ok"
    );


    draw();

  }
  catch(error){

    console.error(error);

    enableButtons(false);

    $("detect").disabled=false;


    setStatus(
      "❌ MediaPipe 检测失败：\n"+
      (error?.message||error),
      "bad"
    );

  }
  finally{

    $("detect").disabled=false;

  }

};


/* =========================================================
   控件
========================================================= */

$("original").onclick=()=>{

  displayMode="original";

  $("photoOpacity").value=100;

  draw();

};


$("xr").onclick=()=>{

  displayMode="xr";

  $("photoOpacity").value=55;

  draw();

};


$("boneOnly").onclick=()=>{

  displayMode="bone";

  draw();

};


$("points").onclick=()=>{

  showPoints=!showPoints;

  $("points").textContent=
    showPoints
      ?"隐藏检测点"
      :"检测点";

  draw();

};


$("photoOpacity").oninput=draw;

$("boneOpacity").oninput=draw;

</script>
