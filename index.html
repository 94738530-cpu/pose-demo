<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI人物自动骨架标注 V1</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#202124}
    .wrap{max-width:900px;margin:auto;padding:18px}
    h1{font-size:24px;margin:8px 0 6px}.sub{color:#666;margin-bottom:16px}
    .card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}
    button,label{display:inline-block;padding:11px 15px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:16px}
    button{cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}
    #status{margin-top:10px;color:#555;min-height:24px}
    #stage{position:relative;display:none;max-width:100%;overflow:hidden;border-radius:12px;background:#111}
    #photo{display:block;max-width:100%;height:auto}
    #overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .note{font-size:13px;color:#666;line-height:1.5}
    input{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>AI人物自动骨架标注 V1</h1>
    <div class="sub">单人照片 · Google MediaPipe Pose Landmarker</div>
    <div class="row">
      <label class="primary" for="file">选择人物照片</label>
      <button id="toggle" type="button" disabled>隐藏骨架</button>
      <input id="file" type="file" accept="image/*">
    </div>
    <div id="status">正在加载 MediaPipe…</div>
  </div>

  <div class="card">
    <div id="stage">
      <img id="photo" alt="人物照片">
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <div class="card note">
    V1 只做真实 Pose Landmarker 自动检测与骨架叠加。没有检测到人物时不显示假骨架。
  </div>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker, DrawingUtils } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const WASM_URL =
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm";

const fileInput = document.getElementById("file");
const photo = document.getElementById("photo");
const canvas = document.getElementById("overlay");
const stage = document.getElementById("stage");
const status = document.getElementById("status");
const toggle = document.getElementById("toggle");
const ctx = canvas.getContext("2d");

let landmarker = null;
let results = null;
let showSkeleton = true;

async function init() {
  try {
    const vision = await FilesetResolver.forVisionTasks(WASM_URL);
    landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL },
      runningMode: "IMAGE",
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    status.textContent = "MediaPipe 已就绪，请上传一张人物照片。";
  } catch (e) {
    console.error(e);
    status.textContent = "MediaPipe 加载失败，请检查网络后刷新页面。";
  }
}

function resizeCanvas() {
  const rect = photo.getBoundingClientRect();
  canvas.width = photo.naturalWidth;
  canvas.height = photo.naturalHeight;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!showSkeleton || !results?.landmarks?.length) return;
  const drawingUtils = new DrawingUtils(ctx);
  drawingUtils.drawConnectors(
    results.landmarks[0],
    PoseLandmarker.POSE_CONNECTIONS,
    { lineWidth: Math.max(2, canvas.width / 450) }
  );
  drawingUtils.drawLandmarks(
    results.landmarks[0],
    { radius: Math.max(3, canvas.width / 180), lineWidth: 1 }
  );
}

photo.onload = () => {
  resizeCanvas();
  draw();
};

fileInput.addEventListener("change", async () => {
  const file = fileInput.files?.[0];
  if (!file || !landmarker) return;

  results = null;
  toggle.disabled = true;
  status.textContent = "正在检测人物…";
  stage.style.display = "block";

  const url = URL.createObjectURL(file);
  photo.src = url;
  await new Promise(resolve => {
    if (photo.complete) resolve();
    else photo.onload = resolve;
  });

  try {
    resizeCanvas();
    results = landmarker.detect(photo);

    if (results?.landmarks?.length) {
      status.textContent = "检测成功：已显示真实 MediaPipe 骨架。";
      toggle.disabled = false;
      showSkeleton = true;
      toggle.textContent = "隐藏骨架";
      draw();
    } else {
      status.textContent = "未检测到人物，没有显示假骨架。";
      toggle.disabled = true;
      draw();
    }
  } catch (e) {
    console.error(e);
    results = null;
    draw();
    status.textContent = "检测失败，请换一张清晰的人物照片再试。";
  }
});

toggle.addEventListener("click", () => {
  showSkeleton = !showSkeleton;
  toggle.textContent = showSkeleton ? "隐藏骨架" : "显示骨架";
  draw();
});

window.addEventListener("resize", () => {
  if (photo.naturalWidth) {
    resizeCanvas();
    draw();
  }
});

init();
</script>
</body>
</html>
