<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MediaPipe 检测点连接测试 V0.2</title>


<style>

body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

.box{
  max-width:620px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
  font-size:23px;
  margin-top:0;
}

.subtitle{
  color:#666;
  margin-bottom:20px;
}

.item{
  padding:15px;
  margin:10px 0;
  background:#f7f7f7;
  border-radius:10px;
  font-size:17px;
}

.wait{
  color:#777;
}

.ok{
  color:#16803c;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

#detail{
  margin-top:20px;
  padding:15px;
  background:#fafafa;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
  word-break:break-word;
}

.small{
  font-size:13px;
  color:#777;
  margin-top:12px;
}

</style>

</head>


<body>


<div class="box">


<h1>🦴 MediaPipe 检测点连接测试</h1>


<div class="subtitle">

V0.2 · 模型下载专项测试

<br>

这一版不检测人物，不画骨架。

</div>


<div
  id="bundle"
  class="item wait"
>

① MediaPipe Bundle：等待…

</div>


<div
  id="wasm"
  class="item wait"
>

② WASM 运行环境：等待…

</div>


<div
  id="download"
  class="item wait"
>

③ Pose 模型文件：等待…

</div>


<div
  id="model"
  class="item wait"
>

④ Pose Landmarker：等待…

</div>


<div
  id="points"
  class="item wait"
>

⑤ 33 点检测系统：等待…

</div>


<div id="detail">

正在初始化……

</div>


<div class="small">

测试目标：确认浏览器可以真正取得
Pose Landmarker 模型文件。

</div>


</div>



<script type="module">


/*
==================================================
MediaPipe V0.2
模型下载专项测试
==================================================
*/


const BUNDLE_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


const WASM_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm";


const MODEL_URL =

"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";



const bundleEl =
document.getElementById("bundle");


const wasmEl =
document.getElementById("wasm");


const downloadEl =
document.getElementById("download");


const modelEl =
document.getElementById("model");


const pointsEl =
document.getElementById("points");


const detailEl =
document.getElementById("detail");



function setOK(el,text){

  el.className="item ok";

  el.textContent="✅ "+text;

}



function setError(el,text){

  el.className="item error";

  el.textContent="❌ "+text;

}



function setWait(el,text){

  el.className="item wait";

  el.textContent="⏳ "+text;

}



function timeout(ms){

  return new Promise(

    (_,reject)=>{

      setTimeout(

        ()=>reject(
          new Error(
            "连接超时"
          )
        ),

        ms

      );

    }

  );

}



async function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    timeout(ms)

  ]);

}



/*
==================================================
① Bundle
==================================================
*/

async function testBundle(){

  try{

    setWait(
      bundleEl,
      "MediaPipe Bundle：正在连接…"
    );


    const vision =

      await withTimeout(

        import(BUNDLE_URL),

        20000

      );


    if(

      !vision.PoseLandmarker ||

      !vision.FilesetResolver

    ){

      throw new Error(
        "Bundle 中没有找到必要组件"
      );

    }


    setOK(
      bundleEl,
      "MediaPipe Bundle：连接成功"
    );


    detailEl.textContent =
      "① Bundle 成功。";

    
    return vision;


  }catch(error){

    setError(
      bundleEl,
      "MediaPipe Bundle：连接失败"
    );


    detailEl.textContent =
      "Bundle 错误：" +
      (error.message || error);


    throw error;

  }

}



/*
==================================================
② WASM
==================================================
*/

async function testWasm(
  FilesetResolver
){

  try{

    setWait(
      wasmEl,
      "WASM：正在连接…"
    );


    const fileset =

      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        20000

      );


    if(!fileset){

      throw new Error(
        "WASM 初始化没有返回对象"
      );

    }


    setOK(
      wasmEl,
      "WASM 运行环境：连接成功"
    );


    detailEl.textContent =
      "② WASM 成功。";


    return fileset;


  }catch(error){

    setError(
      wasmEl,
      "WASM 运行环境：连接失败"
    );


    detailEl.textContent =
      "WASM 错误：" +
      (error.message || error);


    throw error;

  }

}



/*
==================================================
③ 单独测试模型文件
==================================================
*/

async function testModelDownload(){

  try{

    setWait(
      downloadEl,
      "Pose 模型文件：正在连接 Google Storage…"
    );


    detailEl.textContent =
      "③ 正在测试 Pose Landmarker 模型文件。";


    const response =

      await withTimeout(

        fetch(
          MODEL_URL,
          {
            method:"GET",
            cache:"no-store"
          }
        ),

        120000

      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status +
        " " +
        response.statusText
      );

    }


    const contentLength =
      response.headers.get(
        "content-length"
      );


    setOK(
      downloadEl,
      "Pose 模型文件：可以访问"
    );


    detailEl.innerHTML =

      "③ 模型文件连接成功。<br>" +

      "HTTP 状态：" +
      response.status +
      "<br>" +

      "Content-Type：" +
      (
        response.headers.get(
          "content-type"
        ) || "未知"
      ) +
      "<br>" +

      "文件大小：" +
      (
        contentLength
        ? contentLength + " bytes"
        : "服务器未提供"
      );


    /*
      这里不主动读取整个文件。

      fetch 成功已经证明浏览器能够访问
      Google Storage 上的模型地址。
    */


    return true;


  }catch(error){

    setError(
      downloadEl,
      "Pose 模型文件：访问失败"
    );


    detailEl.textContent =

      "模型下载错误：" +
      (error.message || error) +
      "<br><br>" +

      "如果这里失败，说明问题在模型文件访问链路，" +
      "还没有进入 Pose Landmarker。";


    throw error;

  }

}



/*
==================================================
④ 创建 Pose Landmarker
==================================================
*/

async function testPoseModel(
  PoseLandmarker,
  fileset
){

  try{

    setWait(
      modelEl,
      "Pose Landmarker：正在创建…"
    );


    detailEl.textContent =
      "④ 模型文件可以访问，现在创建 Pose Landmarker。";


    const landmarker =

      await withTimeout(

        PoseLandmarker.createFromOptions(

          fileset,

          {

            baseOptions:{

              modelAssetPath:
                MODEL_URL

            },


            runningMode:
              "IMAGE",


            numPoses:
              1,


            minPoseDetectionConfidence:
              0.5,


            minPosePresenceConfidence:
              0.5,


            minTrackingConfidence:
              0.5

          }

        ),

        120000

      );


    if(!landmarker){

      throw new Error(
        "Pose Landmarker 创建失败"
      );

    }


    setOK(
      modelEl,
      "Pose Landmarker：创建成功"
    );


    setOK(
      pointsEl,
      "33 点检测系统：已建立"
    );


    detailEl.innerHTML =

      "<b>🎉 地基打通了！</b>" +

      "<br><br>" +

      "Bundle：OK<br>" +

      "WASM：OK<br>" +

      "Pose 模型文件：OK<br>" +

      "Pose Landmarker：OK<br>" +

      "33 点检测系统：OK<br><br>" +

      "下一步可以开始上传人物照片。" ;


    return landmarker;


  }catch(error){

    setError(
      modelEl,
      "Pose Landmarker：创建失败"
    );


    setError(
      pointsEl,
      "33 点检测系统：尚未建立"
    );


    detailEl.innerHTML =

      "Pose Landmarker 错误：" +

      (error.message || error);


    throw error;

  }

}



/*
==================================================
主测试流程
==================================================
*/

async function start(){

  try{

    /*
    ①
    */

    const vision =
      await testBundle();


    /*
    ②
    */

    const fileset =
      await testWasm(
        vision.FilesetResolver
      );


    /*
    ③
    */

    await testModelDownload();


    /*
    ④
    */

    await testPoseModel(
      vision.PoseLandmarker,
      fileset
    );


  }catch(error){

    console.error(
      "测试结束：",
      error
    );

  }

}



/*
开始
*/

start();


</script>

</body>

</html>
