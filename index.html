<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>自动骨架标注 V1</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#f4f4f4;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.box{
  max-width:720px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

.subtitle{
  color:#666;
  line-height:1.6;
  margin-bottom:18px;
}

.status{
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  background:#f5f5f5;
  font-size:16px;
}

.ok{
  color:#187a35;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

.wait{
  color:#777;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

button,
.fileButton{

  border:0;
  border-radius:10px;

  padding:12px 18px;

  font-size:16px;

  background:#222;
  color:white;

  cursor:pointer;

  display:inline-block;
}

button:disabled{
  opacity:.45;
}

.fileButton{
  background:#1877f2;
}

input[type="file"]{
  display:none;
}

.viewer{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#111;

  min-height:100px;

  display:flex;

  align-items:center;

  justify-content:center;
}

#photo{

  display:block;

  width:100%;

  height:auto;

  max-width:100%;
}

#canvas{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  pointer-events:none;
}

.info{

  margin-top:15px;

  padding:14px;

  background:#f7f7f7;

  border-radius:10px;

  line-height:1.7;

  font-size:14px;

}

.hidden{
  display:none;
}

</style>

</head>


<body>


<div class="box">


<h1>🦴 自动骨架标注 V1</h1>


<div class="subtitle">

真实 MediaPipe Pose Landmarker<br>

上传一张人物照片，检测实际人体 33 个 Pose Landmark。

</div>


<div
  id="status"
  class="status wait"
>

⏳ 正在加载 MediaPipe…

</div>


<div class="controls">


<label
  class="fileButton"
  for="fileInput"
>

📷 选择人物照片

</label>


<input
  id="fileInput"
  type="file"
  accept="image/*"
>


<button
  id="toggleButton"
  disabled
>

隐藏骨架

</button>


<button
  id="clearButton"
  disabled
>

清除照片

</button>


</div>


<div
  id="viewer"
  class="viewer hidden"
>

<img
  id="photo"
  alt="人物照片"
>

<canvas
  id="canvas"
></canvas>

</div>


<div
  id="info"
  class="info"
>

等待系统初始化……

</div>


</div>



<script type="module">


/*
==================================================
自动骨架标注 V1
==================================================

核心原则：

1. 使用真实 MediaPipe Pose Landmarker
2. 不使用固定坐标
3. 不使用预设人体比例
4. 不使用假骨架
5. 单人物模式
6. IMAGE 模式
==================================================
*/


const BUNDLE_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


const WASM_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm";


const MODEL_URL =

"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";



/*
==================================================
页面元素
==================================================
*/

const statusEl =
document.getElementById("status");

const fileInput =
document.getElementById("fileInput");

const toggleButton =
document.getElementById("toggleButton");

const clearButton =
document.getElementById("clearButton");

const viewer =
document.getElementById("viewer");

const photo =
document.getElementById("photo");

const canvas =
document.getElementById("canvas");

const info =
document.getElementById("info");



const ctx =
canvas.getContext("2d");



/*
==================================================
全局变量
==================================================
*/

let PoseLandmarker = null;

let FilesetResolver = null;

let DrawingUtils = null;

let poseLandmarker = null;

let currentResults = null;

let skeletonVisible = true;

let currentImageURL = null;



/*
==================================================
状态显示
==================================================
*/

function setStatus(
  text,
  type="wait"
){

  statusEl.className =
    "status " + type;

  statusEl.textContent =
    text;

}



/*
==================================================
超时函数
==================================================
*/

function timeout(ms){

  return new Promise(
    (_, reject) => {

      setTimeout(

        () => reject(
          new Error("连接超时")
        ),

        ms

      );

    }

  );

}



async function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    timeout(ms)

  ]);

}



/*
==================================================
① 加载 MediaPipe
==================================================
*/

async function initMediaPipe(){

  try{

    setStatus(
      "⏳ 正在加载 MediaPipe Bundle…"
    );


    const vision =

      await withTimeout(

        import(BUNDLE_URL),

        30000

      );


    PoseLandmarker =
      vision.PoseLandmarker;

    FilesetResolver =
      vision.FilesetResolver;

    DrawingUtils =
      vision.DrawingUtils;


    if(
      !PoseLandmarker ||
      !FilesetResolver ||
      !DrawingUtils
    ){

      throw new Error(
        "MediaPipe 组件不完整"
      );

    }


    setStatus(
      "⏳ 正在初始化 WASM…"
    );


    const fileset =

      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        30000

      );


    setStatus(
      "⏳ 正在创建 Pose Landmarker…"
    );


    /*
    使用已经验证成功的模型地址。
    */

    poseLandmarker =

      await withTimeout(

        PoseLandmarker.createFromOptions(

          fileset,

          {

            baseOptions:{

              modelAssetPath:
                MODEL_URL

            },

            runningMode:
              "IMAGE",

            numPoses:
              1,

            minPoseDetectionConfidence:
              0.5,

            minPosePresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        ),

        120000

      );


    setStatus(
      "✅ MediaPipe Pose 已准备完成",
      "ok"
    );


    info.innerHTML =

      "系统状态：<b>准备完成</b><br>" +

      "检测模式：单人物 / IMAGE<br>" +

      "检测器：Google MediaPipe Pose Landmarker<br>" +

      "等待上传人物照片。";


    toggleButton.disabled =
      false;

    clearButton.disabled =
      false;


  }catch(error){

    console.error(error);


    setStatus(
      "❌ MediaPipe 初始化失败",
      "error"
    );


    info.innerHTML =

      "错误信息：<br>" +

      String(
        error.message || error
      ) +

      "<br><br>" +

      "请不要继续修改代码，" +

      "先把这里的错误截图给师傅。";

  }

}



/*
==================================================
② 上传照片
==================================================
*/

fileInput.addEventListener(
  "change",
  handleFile
);



function handleFile(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  if(!poseLandmarker){

    info.textContent =
      "Pose Landmarker 尚未准备完成。";

    return;

  }


  /*
  清除旧检测结果
  */

  currentResults =
    null;


  /*
  清除旧 Canvas
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  释放旧 URL
  */

  if(currentImageURL){

    URL.revokeObjectURL(
      currentImageURL
    );

  }


  currentImageURL =
    URL.createObjectURL(file);


  photo.onload =
    () => {

      viewer.classList.remove(
        "hidden"
      );


      /*
      Canvas 必须和原始图片
      使用相同像素尺寸。

      这样 Landmark 的
      归一化坐标才能准确对应。
      */

      canvas.width =
        photo.naturalWidth;

      canvas.height =
        photo.naturalHeight;


      info.innerHTML =
        "⏳ 正在检测人物…";


      detectPose();

    };


  photo.src =
    currentImageURL;

}



/*
==================================================
③ MediaPipe 实际检测
==================================================
*/

function detectPose(){

  try{

    /*
    关键：

    detect() 直接使用当前图片。

    不使用任何人工坐标。
    */

    currentResults =
      poseLandmarker.detect(
        photo
      );


    console.log(
      "MediaPipe Results:",
      currentResults
    );


    /*
    判断是否真正检测到人物
    */

    if(
      !currentResults ||
      !currentResults.landmarks ||
      currentResults.landmarks.length === 0
    ){

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      info.innerHTML =

        "❌ <b>没有检测到人物</b><br><br>" +

        "系统没有绘制任何骨架。<br>" +

        "这符合 V1 规则：没有真实检测结果，就不显示假骨架。";


      return;

    }


    /*
    单人物模式。

    只取第一个检测到的人。
    */

    const landmarks =
      currentResults.landmarks[0];


    /*
    正常绘制
    */

    drawSkeleton(
      landmarks
    );


    info.innerHTML =

      "✅ <b>检测到人物</b><br><br>" +

      "检测人体数量：1<br>" +

      "Pose Landmark 数量：" +
      landmarks.length +
      "<br><br>" +

      "注意：这里显示的是 MediaPipe 的 Pose Landmark，" +
      "它们是 AI 检测点，不等同于医学解剖标志点。";


  }catch(error){

    console.error(error);


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    info.innerHTML =

      "❌ <b>人物检测失败</b><br><br>" +

      String(
        error.message || error
      );

  }

}



/*
==================================================
④ 绘制真实骨架
==================================================
*/

function drawSkeleton(
  landmarks
){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(!skeletonVisible){

    return;

  }


  /*
  使用 MediaPipe 官方 DrawingUtils。

  不手工制造骨架连接关系。
  */

  const drawingUtils =
    new DrawingUtils(ctx);


  /*
  先画连接线
  */

  drawingUtils.drawConnectors(

    landmarks,

    PoseLandmarker.POSE_CONNECTIONS,

    {

      color:"#00FF00",

      lineWidth:4

    }

  );


  /*
  再画 33 个检测点
  */

  drawingUtils.drawLandmarks(

    landmarks,

    {

      color:"#FF0000",

      fillColor:"#FF0000",

      lineWidth:2,

      radius:5

    }

  );

}



/*
==================================================
⑤ 显示 / 隐藏骨架
==================================================
*/

toggleButton.addEventListener(

  "click",

  () => {

    skeletonVisible =
      !skeletonVisible;


    if(skeletonVisible){

      toggleButton.textContent =
        "隐藏骨架";


      if(
        currentResults &&
        currentResults.landmarks &&
        currentResults.landmarks.length > 0
      ){

        drawSkeleton(
          currentResults.landmarks[0]
        );

      }

    }else{

      toggleButton.textContent =
        "显示骨架";


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }

  }

);



/*
==================================================
⑥ 清除照片
==================================================
*/

clearButton.addEventListener(

  "click",

  () => {

    currentResults =
      null;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    photo.removeAttribute(
      "src"
    );


    viewer.classList.add(
      "hidden"
    );


    fileInput.value =
      "";


    info.innerHTML =

      "等待上传人物照片。";

  }

);



/*
==================================================
启动
==================================================
*/

initMediaPipe();


</script>

</body>

</html>
