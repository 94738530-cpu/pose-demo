<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MediaPipe 检测点连接测试</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
  font-size:23px;
  margin-top:0;
}

.item{
  padding:14px;
  margin:10px 0;
  background:#f7f7f7;
  border-radius:10px;
}

.wait{
  color:#777;
}

.ok{
  color:#16803c;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

#detail{
  margin-top:18px;
  padding:14px;
  background:#fafafa;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
}

</style>
</head>

<body>

<div class="box">

<h1>🦴 MediaPipe 检测点连接测试</h1>

<p>
这一版只测试连接，不检测人物，不画骨架。
</p>

<div id="bundle" class="item wait">
① MediaPipe Bundle：检测中…
</div>

<div id="wasm" class="item wait">
② WASM 运行环境：等待…
</div>

<div id="model" class="item wait">
③ Pose Landmarker 模型：等待…
</div>

<div id="points" class="item wait">
④ 33 点检测系统：等待…
</div>

<div id="detail">
正在初始化……
</div>

</div>


<script type="module">

/*
==================================================
MediaPipe 连接测试
==================================================
*/

const BUNDLE_URL =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

const WASM_URL =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm";

const MODEL_URL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";


const bundleEl =
document.getElementById("bundle");

const wasmEl =
document.getElementById("wasm");

const modelEl =
document.getElementById("model");

const pointsEl =
document.getElementById("points");

const detailEl =
document.getElementById("detail");


function setOK(el,text){

  el.className="item ok";

  el.textContent="✅ "+text;

}


function setError(el,text){

  el.className="item error";

  el.textContent="❌ "+text;

}


function setWait(el,text){

  el.className="item wait";

  el.textContent="⏳ "+text;

}


async function timeoutPromise(ms){

  return new Promise(
    (_,reject)=>{

      setTimeout(
        ()=>reject(
          new Error("连接超时")
        ),
        ms
      );

    }
  );

}


async function withTimeout(promise,ms){

  return Promise.race([

    promise,

    timeoutPromise(ms)

  ]);

}


async function startTest(){

  let PoseLandmarker;
  let FilesetResolver;


  /*
  ================================================
  ① MediaPipe Bundle
  ================================================
  */

  try{

    setWait(
      bundleEl,
      "MediaPipe Bundle：正在连接…"
    );


    const vision =
      await withTimeout(

        import(BUNDLE_URL),

        20000

      );


    PoseLandmarker =
      vision.PoseLandmarker;

    FilesetResolver =
      vision.FilesetResolver;


    if(
      !PoseLandmarker ||
      !FilesetResolver
    ){

      throw new Error(
        "Bundle 已加载，但没有找到 PoseLandmarker / FilesetResolver"
      );

    }


    setOK(
      bundleEl,
      "MediaPipe Bundle：连接成功"
    );


    detailEl.textContent =
      "Bundle 已成功进入网页。继续测试 WASM…";


  }catch(error){

    setError(
      bundleEl,
      "MediaPipe Bundle：连接失败"
    );


    detailEl.textContent =
      "错误：" +
      (error.message || error);


    return;

  }


  /*
  ================================================
  ② WASM
  ================================================
  */

  try{

    setWait(
      wasmEl,
      "WASM 运行环境：正在连接…"
    );


    const visionFiles =
      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        20000

      );


    if(!visionFiles){

      throw new Error(
        "WASM 初始化没有返回运行环境"
      );

    }


    setOK(
      wasmEl,
      "WASM 运行环境：连接成功"
    );


    detailEl.textContent =
      "WASM 已成功启动。继续加载 Pose Landmarker 模型…";


    /*
    ================================================
    ③ Pose Landmarker
    ================================================
    */

    setWait(
      modelEl,
      "Pose Landmarker 模型：正在加载…"
    );


    const landmarker =
      await withTimeout(

        PoseLandmarker.createFromOptions(

          visionFiles,

          {

            baseOptions:{

              modelAssetPath:
                MODEL_URL

            },

            runningMode:
              "IMAGE",

            numPoses:
              1,

            minPoseDetectionConfidence:
              0.5,

            minPosePresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        ),

        30000

      );


    if(!landmarker){

      throw new Error(
        "Pose Landmarker 创建失败"
      );

    }


    setOK(
      modelEl,
      "Pose Landmarker 模型：连接成功"
    );


    /*
    ================================================
    ④ 检测点系统
    ================================================
    */

    /*
      Pose Landmarker 模型正常创建，
      说明真正的 Pose 检测系统已经建立。

      MediaPipe Pose Landmarker 标准姿态模型
      返回 33 个姿态 landmarks。
    */

    setOK(
      pointsEl,
      "33 点检测系统：已建立"
    );


    detailEl.innerHTML =
      "<b>🎉 基础连接测试通过</b><br><br>" +

      "MediaPipe Bundle：OK<br>" +

      "WASM：OK<br>" +

      "Pose Landmarker：OK<br>" +

      "33 点检测系统：OK<br><br>" +

      "下一步才开始上传人物照片进行真实检测。";


  }catch(error){

    setError(
      wasmEl,
      "WASM / 运行环境：失败"
    );


    if(
      modelEl.className.includes("wait")
    ){

      setError(
        modelEl,
        "Pose Landmarker：尚未完成"
      );

    }


    if(
      pointsEl.className.includes("wait")
    ){

      setError(
        pointsEl,
        "33 点检测系统：尚未建立"
      );

    }


    detailEl.textContent =
      "错误：" +
      (error.message || error);


  }

}


startTest();

</script>

</body>
</html>
