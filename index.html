<!DOCTYPE html>

<head>

<style>

<body>

<div class="box">

<h1>🦴 自动骨骼标注 V1.2</h1>

<div class="subtitle">
真实 MediaPipe Pose Landmarker<br>
33 个姿态检测点 → 人体骨骼结构可视化
</div>


<div id="status" class="status wait">
⏳ 正在加载 MediaPipe…
</div>


<div class="controls">

<label class="fileButton" for="fileInput">
📷 选择人物照片
</label>

<input
  id="fileInput"
  type="file"
  accept="image/*"
>

📷 原图+骨骼
</button>

</button>

🦴 仅骨骼
</button>

清除照片
</button>

</div>

>

👁️ 人物透视强度

25%
</div>

  id="viewer"
  class="viewer hidden"
>

  alt="人物照片"
>

  id="canvas"
></canvas>

</div>

  id="info"
  class="info"
>

等待系统初始化……

</div>


<div class="legend">

<b>显示说明</b><br>

🔴 红点：MediaPipe 实际检测 Landmark<br>

🦴 粗线：根据真实 Landmark 推导的骨骼段<br>

○ 头部：根据面部 Landmark 计算的头部区域<br>

⚠️ 骨骼图是姿态结构可视化，不代表医学影像中的真实骨骼。

</div>

</div>



<script type="module">


/*
==================================================
自动骨骼标注 V1.2
==================================================

MediaPipe
    ↓
真实 33 个 Landmark
    ↓
骨骼结构可视化

不使用固定人物坐标
==================================================
*/


const BUNDLE_URL =
"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


const WASM_URL =
"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm";


const MODEL_URL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";


const statusEl =
document.getElementById("status");

const fileInput =
document.getElementById("fileInput");

const normalButton =
document.getElementById("normalButton");

const xrayButton =
document.getElementById("xrayButton");

const skeletonButton =
document.getElementById("skeletonButton");

const clearButton =
document.getElementById("clearButton");

const opacityPanel =
document.getElementById("opacityPanel");

const opacitySlider =
document.getElementById("opacitySlider");

const opacityValue =
document.getElementById("opacityValue");

const viewer =
document.getElementById("viewer");

const photo =
document.getElementById("photo");

const canvas =
document.getElementById("canvas");

const info =
document.getElementById("info");

const ctx =
canvas.getContext("2d");


let PoseLandmarker = null;
let FilesetResolver = null;
let poseLandmarker = null;

let currentResults = null;
let currentImageURL = null;

let displayMode = "normal";
let photoOpacity = 0.25;



function setStatus(
  text,
  type="wait"
){

  statusEl.className =
    "status " + type;

  statusEl.textContent =
    text;

}



function timeout(ms){

  return new Promise(
    (_, reject) => {

      setTimeout(
        () => reject(
          new Error("连接超时")
        ),
        ms
      );

    }
  );

}



async function withTimeout(
  promise,
  ms
){

  return Promise.race([
    promise,
    timeout(ms)
  ]);

}



/*
==================================================
MediaPipe 初始化
==================================================
*/

async function initMediaPipe(){

  try{

    setStatus(
      "⏳ 正在加载 MediaPipe Bundle…"
    );


    const vision =
      await withTimeout(
        import(BUNDLE_URL),
        30000
      );


    PoseLandmarker =
      vision.PoseLandmarker;

    FilesetResolver =
      vision.FilesetResolver;


    if(
      !PoseLandmarker ||
      !FilesetResolver
    ){

      throw new Error(
        "MediaPipe 组件不完整"
      );

    }


    setStatus(
      "⏳ 正在初始化 WASM…"
    );


    const fileset =
      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        30000

      );


    setStatus(
      "⏳ 正在创建 Pose Landmarker…"
    );


    poseLandmarker =
      await withTimeout(

        PoseLandmarker.createFromOptions(

          fileset,

          {

            baseOptions:{
              modelAssetPath:
                MODEL_URL
            },

            runningMode:
              "IMAGE",

            numPoses:
              1,

            minPoseDetectionConfidence:
              0.5,

            minPosePresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        ),

        120000

      );


    setStatus(
      "✅ MediaPipe Pose 已准备完成",
      "ok"
    );


    normalButton.disabled =
      false;

    xrayButton.disabled =
      false;

    skeletonButton.disabled =
      false;

    clearButton.disabled =
      false;


    info.innerHTML =
      "系统状态：<b>准备完成</b><br>" +
      "等待上传人物照片。";


  }catch(error){

    console.error(error);


    setStatus(
      "❌ MediaPipe 初始化失败",
      "error"
    );


    info.innerHTML =
      "错误信息：<br>" +
      String(
        error.message || error
      );

  }

}



/*
==================================================
上传照片
==================================================
*/

fileInput.addEventListener(
  "change",
  handleFile
);



function handleFile(event){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  if(!poseLandmarker){

    info.textContent =
      "Pose Landmarker 尚未准备完成。";

    return;

  }


  currentResults =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(currentImageURL){

    URL.revokeObjectURL(
      currentImageURL
    );

  }


  currentImageURL =
    URL.createObjectURL(file);


  photo.onload =
    () => {

      viewer.classList.remove(
        "hidden"
      );


      canvas.width =
        photo.naturalWidth;

      canvas.height =
        photo.naturalHeight;


      displayMode =
        "normal";


      photo.style.opacity =
        "1";


      viewer.classList.remove(
        "skeletonOnly"
      );


      opacityPanel.classList.add(
        "hidden"
      );


      info.innerHTML =
        "⏳ 正在检测人物…";


      detectPose();

    };


  photo.src =
    currentImageURL;

}



/*
==================================================
真实人物检测
==================================================
*/

function detectPose(){

  try{

    currentResults =
      poseLandmarker.detect(
        photo
      );


    if(
      !currentResults ||
      !currentResults.landmarks ||
      currentResults.landmarks.length === 0
    ){

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      info.innerHTML =
        "❌ <b>没有检测到人物</b><br><br>" +
        "系统不会绘制任何骨骼。";


      return;

    }


    const landmarks =
      currentResults.landmarks[0];


    drawSkeleton(
      landmarks
    );


    info.innerHTML =
      "✅ <b>检测到人物</b><br><br>" +
      "检测人体数量：1<br>" +
      "MediaPipe Landmark：" +
      landmarks.length +
      "<br><br>" +
      "当前显示：骨骼结构可视化";


  }catch(error){

    console.error(error);


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    info.innerHTML =
      "❌ <b>人物检测失败</b><br><br>" +
      String(
        error.message || error
      );

  }

}



/*
==================================================
Landmark 工具
==================================================
*/

function P(
  landmarks,
  index
){

  const p =
    landmarks[index];


  if(!p){
    return null;
  }


  return {

    x:
      p.x * canvas.width,

    y:
      p.y * canvas.height,

    z:
      p.z || 0,

    visibility:
      p.visibility ?? 1

  };

}



function distance(a,b){

  if(!a || !b){
    return 0;
  }

  return Math.hypot(
    b.x-a.x,
    b.y-a.y
  );

}



function midpoint(a,b){

  if(!a || !b){
    return null;
  }

  return {

    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2

  };

}



/*
==================================================
骨骼段
==================================================
*/

function drawBone(
  a,
  b,
  width
){

  if(!a || !b){
    return;
  }


  ctx.save();


  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );


  ctx.lineWidth =
    width;

  ctx.lineCap =
    "round";

  ctx.strokeStyle =
    "#F2F2F2";

  ctx.stroke();


  ctx.lineWidth =
    Math.max(
      2,
      width * 0.25
    );

  ctx.strokeStyle =
    "#444";

  ctx.stroke();


  ctx.restore();

}



/*
==================================================
关节
==================================================
*/

function drawJoint(
  p,
  radius
){

  if(!p){
    return;
  }


  ctx.save();


  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "#F2F2F2";

  ctx.fill();


  ctx.lineWidth =
    2;

  ctx.strokeStyle =
    "#333";

  ctx.stroke();


  ctx.restore();

}



/*
==================================================
头部
==================================================
*/

function drawHead(
  landmarks
){

  const nose =
    P(landmarks,0);

  const leftEye =
    P(landmarks,2);

  const rightEye =
    P(landmarks,5);

  const leftEar =
    P(landmarks,7);

  const rightEar =
    P(landmarks,8);


  if(!nose){
    return;
  }


  let width = 0;


  if(
    leftEar &&
    rightEar
  ){

    width =
      distance(
        leftEar,
        rightEar
      );

  }


  if(width < 20){

    width =
      distance(
        leftEye,
        rightEye
      ) * 3;

  }


  if(width < 20){
    width = 60;
  }


  const height =
    width * 1.25;


  const center = {

    x:nose.x,

    y:
      nose.y -
      height * 0.18

  };


  ctx.save();


  ctx.beginPath();


  ctx.ellipse(

    center.x,
    center.y,

    width / 2,
    height / 2,

    0,
    0,
    Math.PI * 2

  );


  ctx.lineWidth =
    Math.max(
      5,
      width * 0.12
    );

  ctx.strokeStyle =
    "#F2F2F2";

  ctx.stroke();


  ctx.lineWidth =
    Math.max(
      2,
      width * 0.03
    );

  ctx.strokeStyle =
    "#444";

  ctx.stroke();


  ctx.restore();

}



/*
==================================================
脊柱
==================================================
*/

function drawSpine(
  landmarks
){

  const ls =
    P(landmarks,11);

  const rs =
    P(landmarks,12);

  const lh =
    P(landmarks,23);

  const rh =
    P(landmarks,24);


  const shoulderCenter =
    midpoint(
      ls,
      rs
    );


  const hipCenter =
    midpoint(
      lh,
      rh
    );


  if(
    !shoulderCenter ||
    !hipCenter
  ){

    return;

  }


  drawBone(

    shoulderCenter,

    hipCenter,

    Math.max(
      8,
      distance(
        ls,
        rs
      ) * 0.10
    )

  );

}



/*
==================================================
肩带
==================================================
*/

function drawShoulderGirdle(
  landmarks
){

  const ls =
    P(landmarks,11);

  const rs =
    P(landmarks,12);


  drawBone(

    ls,
    rs,

    Math.max(
      7,
      distance(ls,rs) * 0.12
    )

  );

}



/*
==================================================
骨盆
==================================================
*/

function drawPelvis(
  landmarks
){

  const lh =
    P(landmarks,23);

  const rh =
    P(landmarks,24);


  drawBone(

    lh,
    rh,

    Math.max(
      9,
      distance(lh,rh) * 0.16
    )

  );

}



/*
==================================================
手臂
==================================================
*/

function drawArms(
  landmarks
){

  const ls =
    P(landmarks,11);

  const le =
    P(landmarks,13);

  const lw =
    P(landmarks,15);


  const rs =
    P(landmarks,12);

  const re =
    P(landmarks,14);

  const rw =
    P(landmarks,16);


  drawBone(
    ls,
    le,
    Math.max(
      7,
      distance(ls,le)*0.15
    )
  );


  drawBone(
    rs,
    re,
    Math.max(
      7,
      distance(rs,re)*0.15
    )
  );


  drawBone(
    le,
    lw,
    Math.max(
      6,
      distance(le,lw)*0.13
    )
  );


  drawBone(
    re,
    rw,
    Math.max(
      6,
      distance(re,rw)*0.13
    )
  );


  drawJoint(le,8);
  drawJoint(re,8);
  drawJoint(lw,7);
  drawJoint(rw,7);

}



/*
==================================================
腿
==================================================
*/

function drawLegs(
  landmarks
){

  const lh =
    P(landmarks,23);

  const lk =
    P(landmarks,25);

  const la =
    P(landmarks,27);


  const rh =
    P(landmarks,24);

  const rk =
    P(landmarks,26);

  const ra =
    P(landmarks,28);


  drawBone(
    lh,
    lk,
    Math.max(
      9,
      distance(lh,lk)*0.16
    )
  );


  drawBone(
    rh,
    rk,
    Math.max(
      9,
      distance(rh,rk)*0.16
    )
  );


  drawBone(
    lk,
    la,
    Math.max(
      7,
      distance(lk,la)*0.13
    )
  );


  drawBone(
    rk,
    ra,
    Math.max(
      7,
      distance(rk,ra)*0.13
    )
  );


  drawJoint(lk,9);
  drawJoint(rk,9);

  drawJoint(la,7);
  drawJoint(ra,7);

}



/*
==================================================
脚
==================================================
*/

function drawFeet(
  landmarks
){

  const la =
    P(landmarks,27);

  const lHeel =
    P(landmarks,29);

  const lToe =
    P(landmarks,31);


  const ra =
    P(landmarks,28);

  const rHeel =
    P(landmarks,30);

  const rToe =
    P(landmarks,32);


  drawBone(
    la,
    lHeel,
    6
  );


  drawBone(
    lHeel,
    lToe,
    5
  );


  drawBone(
    ra,
    rHeel,
    6
  );


  drawBone(
    rHeel,
    rToe,
    5
  );

}



/*
==================================================
主要关节
==================================================
*/

function drawMajorJoints(
  landmarks
){

  const indexes = [

    11,12,

    13,14,

    15,16,

    23,24,

    25,26,

    27,28

  ];


  indexes.forEach(

    index => {

      drawJoint(

        P(
          landmarks,
          index
        ),

        6

      );

    }

  );

}



/*
==================================================
最终骨骼
==================================================
*/

function drawSkeleton(
  landmarks
){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(!landmarks){
    return;
  }


  drawHead(
    landmarks
  );


  drawSpine(
    landmarks
  );


  drawShoulderGirdle(
    landmarks
  );


  drawPelvis(
    landmarks
  );


  drawArms(
    landmarks
  );


  drawLegs(
    landmarks
  );


  drawFeet(
    landmarks
  );


  drawMajorJoints(
    landmarks
  );


  /*
  原图模式和透视模式
  显示真实 Landmark 红点
  */

  if(
    displayMode !== "skeleton"
  ){

    drawOriginalLandmarks(
      landmarks
    );

  }

}



/*
==================================================
显示真实 Landmark
==================================================
*/

function drawOriginalLandmarks(
  landmarks
){

  landmarks.forEach(

    p => {

      if(!p){
        return;
      }


      const x =
        p.x * canvas.width;

      const y =
        p.y * canvas.height;


      ctx.save();


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        "#FF3030";


      ctx.fill();


      ctx.restore();

    }

  );

}



/*
==================================================
原图 + 骨骼
==================================================
*/

normalButton.addEventListener(

  "click",

  () => {

    if(!currentResults){
      return;
    }


    displayMode =
      "normal";


    photo.style.opacity =
      "1";


    opacityPanel.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "skeletonOnly"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "📷 <b>原图 + 骨骼</b><br><br>" +

      "人物照片：100%<br>" +

      "骨骼：由真实 MediaPipe Landmark 推导。";

  }

);



/*
==================================================
透视骨骼
==================================================
*/

xrayButton.addEventListener(

  "click",

  () => {

    if(!currentResults){
      return;
    }


    displayMode =
      "xray";


    photo.style.opacity =
      photoOpacity;


    opacityPanel.classList.remove(
      "hidden"
    );


    viewer.classList.remove(
      "skeletonOnly"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "👁️ <b>透视骨骼模式</b><br><br>" +

      "人物照片透明度：" +

      Math.round(
        photoOpacity * 100
      ) +

      "%<br><br>" +

      "白色粗线：骨骼结构可视化<br>" +

      "红点：真实 MediaPipe Landmark";

  }

);



/*
==================================================
仅骨骼
==================================================
*/

skeletonButton.addEventListener(

  "click",

  () => {

    if(!currentResults){
      return;
    }


    displayMode =
      "skeleton";


    photo.style.opacity =
      "0";


    opacityPanel.classList.add(
      "hidden"
    );


    viewer.classList.add(
      "skeletonOnly"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "🦴 <b>仅骨骼模式</b><br><br>" +

      "人物照片：隐藏<br>" +

      "显示：根据真实 MediaPipe Landmark 推导的骨骼结构<br><br>" +

      "这不是医学 X 光骨骼，而是人体姿态结构可视化。";

  }

);



/*
==================================================
透视强度
==================================================
*/

opacitySlider.addEventListener(

  "input",

  () => {

    const value =
      Number(
        opacitySlider.value
      );


    photoOpacity =
      value / 100;


    opacityValue.textContent =
      value + "%";


    if(
      displayMode === "xray"
    ){

      photo.style.opacity =
        photoOpacity;

    }

  }

);



/*
==================================================
清除
==================================================
*/

clearButton.addEventListener(

  "click",

  () => {

    currentResults =
      null;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if(currentImageURL){

      URL.revokeObjectURL(
        currentImageURL
      );

      currentImageURL =
        null;

    }


    photo.removeAttribute(
      "src"
    );


    viewer.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "skeletonOnly"
    );


    opacityPanel.classList.add(
      "hidden"
    );


    fileInput.value =
      "";


    displayMode =
      "normal";


    photo.style.opacity =
      "1";


    info.innerHTML =
      "等待上传人物照片。";

  }

);



/*
==================================================
启动
==================================================
*/

initMediaPipe();


</script>

</body>

</html>
