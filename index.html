<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>人体 X 光解剖骨架 V1.5</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101010;color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif
}
header{
  position:sticky;top:0;z-index:20;background:#171717;
  border-bottom:1px solid #333;padding:11px 12px
}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:11px;color:#aaa;line-height:1.45}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
button,.file{
  border:1px solid #555;background:#292929;color:#eee;
  border-radius:9px;padding:8px 10px;font-size:12px
}
button:disabled{opacity:.4}
.file input{display:none}

main{
  display:grid;grid-template-columns:minmax(0,1fr) 320px;
  gap:10px;padding:10px;max-width:1500px;margin:auto
}
.viewer{
  background:#050505;border:1px solid #333;border-radius:12px;
  overflow:auto;min-height:62vh;padding:10px;
  display:flex;align-items:flex-start;justify-content:center
}
#empty{margin:auto;color:#888;text-align:center;line-height:1.8}
#stage{position:relative;display:none;line-height:0;margin:auto}
#img{display:block;max-width:100%;height:auto}
#overlay{position:absolute;left:0;top:0;pointer-events:none}

.panel{
  background:#191919;border:1px solid #333;
  border-radius:12px;padding:11px
}
.panel h2{font-size:14px;margin:0 0 8px}
.note{
  background:#222;border-radius:9px;padding:9px;
  font-size:11px;line-height:1.55;margin:8px 0
}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}
.row input[type=range]{flex:1}
#status{white-space:pre-wrap;font-size:11px;line-height:1.55;color:#bbb}
.ok{color:#91db9a}.bad{color:#ff8585}
.legend{font-size:10px;color:#999;line-height:1.55}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  .panel{order:2}
  .viewer{min-height:48vh}
}
</style>
</head>

<body>

<header>

<h1>人体 X 光解剖骨架 V1.5</h1>

<div class="sub">
33点姿态驱动 · 骨盆 / 耻骨参考 · 胸廓 / 脊柱升级
</div>

<div class="toolbar">

<label class="file">
打开人物图
<input id="file" type="file" accept="image/*">
</label>

<button id="detect" disabled>开始检测</button>
<button id="original" disabled>原图</button>
<button id="xr" disabled>X 光</button>
<button id="boneOnly" disabled>仅骨架</button>
<button id="points" disabled>检测点</button>

</div>

</header>


<main>

<section class="viewer">

<div id="empty">
先打开一张人物图片
</div>

<div id="stage">

<img id="img">

<canvas id="overlay"></canvas>

</div>

</section>


<aside class="panel">

<h2>V1.5 骨架检测</h2>

<div id="status">
等待图片。
</div>

<div class="note">

<b>本版重点</b><br>

① 四肢必须跟随真实关节。<br>
② 胸廓随肩宽和躯干方向变化。<br>
③ 脊柱保持人体中轴。<br>
④ 骨盆不再使用单纯椭圆。<br>
⑤ 增加骨盆中心与耻骨参考区域。<br>
⑥ 不用固定骨架图片覆盖人物。

</div>

<div class="row">
<label>人物透明度</label>
<input id="photoOpacity" type="range" min="10" max="100" value="55">
</div>

<div class="row">
<label>骨架强度</label>
<input id="boneOpacity" type="range" min="20" max="100" value="90">
</div>

<div class="legend">

红点：高可信姿态点<br>
黄点：较低可信姿态点<br><br>

耻骨区域为根据左右髋部姿态推导的参考位置，
不是 MediaPipe 直接检测出的医学解剖点。

</div>

</aside>

</main>


<script type="module">

const $=id=>document.getElementById(id);

const img=$("img");
const canvas=$("overlay");
const ctx=canvas.getContext("2d");

const stage=$("stage");
const empty=$("empty");
const status=$("status");

let W=0;
let H=0;

let landmarks=null;
let detector=null;

let showPoints=false;


/* =========================
   基础
========================= */

function P(i){
  return landmarks?.[i]||null;
}

function mid(a,b){
  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };
}

function dist(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function unit(a,b){

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const d=Math.hypot(dx,dy)||1;

  return {
    x:dx/d,
    y:dy/d
  };
}

function perp(v){
  return {
    x:-v.y,
    y:v.x
  };
}

function lerp(a,b,t){
  return {
    x:a.x+(b.x-a.x)*t,
    y:a.y+(b.y-a.y)*t
  };
}

function setStatus(text,cls=""){
  status.className=cls;
  status.textContent=text;
}

function enableButtons(v){

  [
    "original",
    "xr",
    "boneOnly",
    "points"
  ].forEach(id=>{
    $(id).disabled=!v;
  });

}


/* =========================
   绘图
========================= */

function capsule(a,b,r1,r2,fill){

  const u=unit(a,b);
  const n=perp(u);

  ctx.beginPath();

  ctx.moveTo(
    a.x+n.x*r1,
    a.y+n.y*r1
  );

  ctx.lineTo(
    b.x+n.x*r2,
    b.y+n.y*r2
  );

  ctx.lineTo(
    b.x-n.x*r2,
    b.y-n.y*r2
  );

  ctx.lineTo(
    a.x-n.x*r1,
    a.y-n.y*r1
  );

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

}


function line(a,b,w,color){

  ctx.beginPath();

  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);

  ctx.lineWidth=w;
  ctx.strokeStyle=color;

  ctx.stroke();

}


function circle(p,r,fill,stroke=""){

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){

    ctx.lineWidth=1;
    ctx.strokeStyle=stroke;
    ctx.stroke();

  }

}


function ellipse(
  p,
  rx,
  ry,
  rotation,
  fill,
  stroke=""
){

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    rx,
    ry,
    rotation,
    0,
    Math.PI*2
  );

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){

    ctx.lineWidth=1;
    ctx.strokeStyle=stroke;
    ctx.stroke();

  }

}


function arc(
  p,
  rx,
  ry,
  rotation,
  start,
  end,
  width,
  color
){

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    rx,
    ry,
    rotation,
    start,
    end
  );

  ctx.lineWidth=width;
  ctx.strokeStyle=color;

  ctx.stroke();

}


/* =========================
   V1.5 解剖骨架
========================= */

function drawSkeleton(){

  const ls=P(11);
  const rs=P(12);

  const le=P(13);
  const re=P(14);

  const lw=P(15);
  const rw=P(16);

  const lh=P(23);
  const rh=P(24);

  const lk=P(25);
  const rk=P(26);

  const la=P(27);
  const ra=P(28);

  const lf=P(29);
  const rf=P(30);

  const lt=P(31);
  const rt=P(32);

  const earL=P(7);
  const earR=P(8);

  const nose=P(0);


  if(!ls||!rs||!lh||!rh){
    return;
  }


  /* =========================
     身体基准
  ========================= */

  const S=mid(ls,rs);
  const G=mid(lh,rh);

  const shoulderWidth=
    dist(ls,rs);

  const hipWidth=
    dist(lh,rh);

  const torsoLength=
    dist(S,G);

  const axis=
    unit(S,G);

  const normal=
    perp(axis);

  const rotation=
    Math.atan2(
      axis.y,
      axis.x
    );


  const boneColor=
    "rgba(235,253,255,.90)";

  const bright=
    "rgba(195,248,255,.96)";

  const thin=
    "rgba(110,225,245,.70)";


  ctx.save();

  ctx.globalAlpha=
    Number(
      $("boneOpacity").value
    )/100;

  ctx.shadowBlur=6;

  ctx.shadowColor=
    "rgba(90,230,255,.55)";


  /* =========================
     头骨
  ========================= */

  let headCenter;
  let headRotation=0;

  if(earL&&earR){

    headCenter=
      mid(earL,earR);

    headRotation=
      Math.atan2(
        earR.y-earL.y,
        earR.x-earL.x
      );

  }
  else if(nose){

    headCenter={
      x:nose.x,
      y:nose.y-shoulderWidth*.16
    };

  }
  else{

    headCenter={
      x:S.x,
      y:S.y-shoulderWidth*.25
    };

  }


  const headWidth=
    earL&&earR
      ? dist(earL,earR)
      : shoulderWidth*.18;


  ellipse(
    headCenter,
    Math.max(
      headWidth*.78,
      shoulderWidth*.08
    ),
    Math.max(
      headWidth*.98,
      shoulderWidth*.11
    ),
    headRotation,
    "rgba(230,252,255,.14)",
    bright
  );


  /* 颅骨中心线 */

  if(nose){

    line(
      headCenter,
      nose,
      Math.max(
        1.5,
        shoulderWidth*.010
      ),
      thin
    );

  }


  /* =========================
     锁骨
  ========================= */

  line(
    ls,
    S,
    Math.max(
      2,
      shoulderWidth*.018
    ),
    bright
  );

  line(
    S,
    rs,
    Math.max(
      2,
      shoulderWidth*.018
    ),
    bright
  );


  /* =========================
     胸廓中心
  ========================= */

  const chestCenter=
    lerp(
      S,
      G,
      .30
    );


  const chestWidth=
    shoulderWidth*.48;

  const chestHeight=
    torsoLength*.22;


  ellipse(
    chestCenter,
    chestWidth,
    chestHeight,
    rotation,
    "rgba(150,240,255,.035)",
    thin
  );


  /* =========================
     肋骨
  ========================= */

  for(let i=0;i<7;i++){

    const t=
      .18+i*.075;

    const center=
      lerp(
        S,
        G,
        t
      );


    const width=
      shoulderWidth*
      (.43-i*.035);


    const height=
      torsoLength*.034;


    arc(
      center,
      width,
      height,
      rotation,
      Math.PI*.08,
      Math.PI*.92,
      Math.max(
        1.3,
        shoulderWidth*.008
      ),
      thin
    );

  }


  /* =========================
     胸骨
  ========================= */

  const sternumTop=
    lerp(
      S,
      G,
      .12
    );

  const sternumBottom=
    lerp(
      S,
      G,
      .60
    );


  capsule(
    sternumTop,
    sternumBottom,
    shoulderWidth*.010,
    shoulderWidth*.008,
    boneColor
  );


  /* =========================
     脊柱
  ========================= */

  const spine=[];


  for(let i=0;i<=11;i++){

    const t=
      .10+i*.075;

    spine.push(
      lerp(
        S,
        G,
        t
      )
    );

  }


  for(let i=0;i<spine.length-1;i++){

    capsule(
      spine[i],
      spine[i+1],
      Math.max(
        1.2,
        shoulderWidth*.013
      ),
      Math.max(
        1.0,
        shoulderWidth*.011
      ),
      boneColor
    );


    circle(
      spine[i],
      Math.max(
        1.4,
        shoulderWidth*.016
      ),
      "rgba(245,255,255,.55)"
    );

  }


  /* =========================
     骨盆升级
  ========================= */

  const pelvisCenter=
    G;


  const pelvisWidth=
    hipWidth*.78;


  const pelvisHeight=
    torsoLength*.17;


  /*
     左右髂骨翼：
     不再使用一个简单完整椭圆。
  */

  arc(
    lh,
    hipWidth*.43,
    pelvisHeight*.72,
    rotation,
    Math.PI*.55,
    Math.PI*1.45,
    Math.max(
      2,
      hipWidth*.015
    ),
    bright
  );


  arc(
    rh,
    hipWidth*.43,
    pelvisHeight*.72,
    rotation,
    -Math.PI*.45,
    Math.PI*.45,
    Math.max(
      2,
      hipWidth*.015
    ),
    bright
  );


  /* 骨盆上缘 */

  line(
    lh,
    rh,
    Math.max(
      2,
      hipWidth*.017
    ),
    bright
  );


  /* 骨盆中心 */

  circle(
    pelvisCenter,
    Math.max(
      2.5,
      hipWidth*.026
    ),
    "rgba(240,255,255,.60)"
  );


  /* =========================
     骨盆下缘
  ========================= */

  const lowerLeft=
    lerp(
      lh,
      pelvisCenter,
      .62
    );

  const lowerRight=
    lerp(
      rh,
      pelvisCenter,
      .62
    );


  line(
    lh,
    lowerLeft,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    thin
  );


  line(
    rh,
    lowerRight,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    thin
  );


  /* =========================
     耻骨参考点
  ========================= */

  /*
     这是姿态推导参考点。
     不是 MediaPipe 原生检测点。
  */

  const pubic=
    lerp(
      pelvisCenter,
      lerp(
        lowerLeft,
        lowerRight,
        .5
      ),
      .72
    );


  circle(
    pubic,
    Math.max(
      2.5,
      hipWidth*.025
    ),
    "rgba(255,255,255,.88)"
  );


  /* 耻骨三角参考结构 */

  line(
    lowerLeft,
    pubic,
    Math.max(
      1.4,
      hipWidth*.011
    ),
    thin
  );


  line(
    lowerRight,
    pubic,
    Math.max(
      1.4,
      hipWidth*.011
    ),
    thin
  );


  /* =========================
     左臂
  ========================= */

  if(le&&lw){

    capsule(
      ls,
      le,
      shoulderWidth*.040,
      shoulderWidth*.028,
      boneColor
    );


    capsule(
      le,
      lw,
      shoulderWidth*.030,
      shoulderWidth*.021,
      boneColor
    );


    circle(
      le,
      shoulderWidth*.028,
      "rgba(240,255,255,.68)"
    );

  }


  /* =========================
     右臂
  ========================= */

  if(re&&rw){

    capsule(
      rs,
      re,
      shoulderWidth*.040,
      shoulderWidth*.028,
      boneColor
    );


    capsule(
      re,
      rw,
      shoulderWidth*.030,
      shoulderWidth*.021,
      boneColor
    );


    circle(
      re,
      shoulderWidth*.028,
      "rgba(240,255,255,.68)"
    );

  }


  /* =========================
     左腿
  ========================= */

  if(lk&&la){

    capsule(
      lh,
      lk,
      hipWidth*.048,
      hipWidth*.033,
      boneColor
    );


    capsule(
      lk,
      la,
      hipWidth*.035,
      hipWidth*.024,
      boneColor
    );


    circle(
      lk,
      hipWidth*.032,
      "rgba(240,255,255,.68)"
    );

  }


  /* =========================
     右腿
  ========================= */

  if(rk&&ra){

    capsule(
      rh,
      rk,
      hipWidth*.048,
      hipWidth*.033,
      boneColor
    );


    capsule(
      rk,
      ra,
      hipWidth*.035,
      hipWidth*.024,
      boneColor
    );


    circle(
      rk,
      hipWidth*.032,
      "rgba(240,255,255,.68)"
    );

  }


  /* =========================
     足部
  ========================= */

  if(lf&&lt){

    capsule(
      lf,
      lt,
      hipWidth*.028,
      hipWidth*.017,
      boneColor
    );

  }


  if(rf&&rt){

    capsule(
      rf,
      rt,
      hipWidth*.028,
      hipWidth*.017,
      boneColor
    );

  }


  ctx.restore();

}


/* =========================
   检测点
========================= */

function drawPoints(){

  if(!landmarks)return;

  ctx.save();

  landmarks.forEach(p=>{

    if((p.v??1)<.35)return;

    circle(
      p,
      Math.max(
        3,
        W*.0027
      ),
      (p.v??1)>=.7
        ? "#ff4d5d"
        : "#ffd35c"
    );

  });

  ctx.restore();

}


/* =========================
   画面
========================= */

function draw(){

  if(!W)return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(!landmarks){

    img.style.opacity=1;

    return;

  }


  const mode=
    $("mode")?.value || "xr";


  if(mode==="bone"){

    img.style.opacity=0;

  }
  else{

    img.style.opacity=
      Number(
        $("photoOpacity").value
      )/100;

  }


  drawSkeleton();


  if(showPoints){

    drawPoints();

  }

}


function resizeCanvas(){

  if(!W)return;

  canvas.width=W;
  canvas.height=H;

  canvas.style.width=
    img.clientWidth+"px";

  canvas.style.height=
    img.clientHeight+"px";

  draw();

}


new ResizeObserver(
  resizeCanvas
).observe(img);


/* =========================
   图片
========================= */

$("file").onchange=e=>{

  const file=
    e.target.files?.[0];

  if(!file)return;


  const url=
    URL.createObjectURL(file);


  img.onload=()=>{

    W=img.naturalWidth;
    H=img.naturalHeight;

    stage.style.display=
      "inline-block";

    empty.style.display=
      "none";


    landmarks=null;

    enableButtons(false);

    $("detect").disabled=false;


    img.style.opacity=1;

    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    setStatus(
      `图片已载入：${W} × ${H}
点击“开始检测”。`
    );


    URL.revokeObjectURL(url);

    resizeCanvas();

  };


  img.src=url;

};


/* =========================
   MediaPipe
========================= */

async function loadMediaPipe(){

  setStatus(
    `正在加载 MediaPipe…
首次加载模型可能需要一点时间。`
  );


  const {
    PoseLandmarker,
    FilesetResolver
  }=await import(
    "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs"
  );


  const vision=
    await FilesetResolver.forVisionTasks(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
    );


  detector=
    await PoseLandmarker.createFromOptions(
      vision,
      {

        baseOptions:{

          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

        },

        runningMode:"IMAGE",

        numPoses:1,

        minPoseDetectionConfidence:.5,

        minPosePresenceConfidence:.5,

        minTrackingConfidence:.5

      }
    );

}


/* =========================
   检测
========================= */

$("detect").onclick=
async()=>{

  if(!W)return;

  $("detect").disabled=true;


  try{

    if(!detector){

      await loadMediaPipe();

    }


    const result=
      detector.detect(img);


    if(!result.landmarks?.length){

      landmarks=null;

      draw();

      enableButtons(false);

      $("detect").disabled=false;


      setStatus(
        `❌ 没有检测到人物。
没有检测到人物就不画假骨架。`,
        "bad"
      );

      return;

    }


    landmarks=
      result.landmarks[0]
      .map((p,i)=>({

        x:p.x*W,
        y:p.y*H,
        z:p.z,
        v:p.visibility??1,
        i

      }));


    enableButtons(true);


    setStatus(
      `✅ 检测完成：1 人物 / 33 个姿态点

V1.5 骨架已建立。

重点检查：
肩 → 肘 → 腕
髋 → 膝 → 踝
胸廓 → 脊柱 → 骨盆
以及骨盆中心 / 耻骨参考位置。`,
      "ok"
    );


    draw();

  }
  catch(error){

    console.error(error);

    enableButtons(false);

    $("detect").disabled=false;


    setStatus(
      "❌ MediaPipe 检测失败：\n"+
      (error?.message||error),
      "bad"
    );

  }
  finally{

    $("detect").disabled=false;

  }

};


/* =========================
   UI
========================= */

[
  "photoOpacity",
  "boneOpacity"
].forEach(id=>{

  $(id).addEventListener(
    "input",
    draw
  );

});


$("original").onclick=()=>{

  $("photoOpacity").value=100;

  draw();

};


$("xr").onclick=()=>{

  $("photoOpacity").value=55;

  draw();

};


$("boneOnly").onclick=()=>{

  if($("photoOpacity")){
    $("photoOpacity").value=0;
  }

  img.style.opacity=0;

  draw();

};


$("points").onclick=()=>{

  showPoints=!showPoints;
