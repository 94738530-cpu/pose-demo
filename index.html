<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AI人物自动骨架标注 V1.2</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#202124;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

h1{
  font-size:24px;
  margin:8px 0 6px;
}

.sub{
  color:#666;
  margin-bottom:16px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button,
label{
  display:inline-block;
  padding:11px 15px;
  border-radius:10px;
  border:1px solid #ddd;
  background:#fff;
  font-size:16px;
}

button{
  cursor:pointer;
}

.primary{
  background:#222;
  color:#fff;
  border-color:#222;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#status{
  margin-top:12px;
  min-height:24px;
  line-height:1.5;
  color:#555;
}

#stage
