<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>人体骨架透视检测器 V1.3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101010;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,
              "PingFang SC","Segoe UI",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#171717;
  border-bottom:1px solid #333;
  padding:11px 12px;
}

h1{
  font-size:18px;
  margin:0 0 3px;
}

.sub{
  font-size:11px;
  color:#aaa;
  line-height:1.45;
}

.toolbar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:9px;
}

button,
.file{
  border:1px solid #555;
  background:#292929;
  color:#eee;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

button:disabled{
  opacity:.45;
}

.file input{
  display:none;
}

main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:10px;
  padding:10px;
  max-width:1500px;
  margin:auto;
}

.viewer{
  background:#060606;
  border:1px solid #333;
  border-radius:12px;
  overflow:auto;
  min-height:62vh;
  padding:10px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

#empty{
  text-align:center;
  color:#999;
  margin:auto;
  line-height:1.8;
}

#stage{
  position:relative;
  display:none;
  line-height:0;
  margin:auto;
}

#img{
  display:block;
  max-width:100%;
  height:auto;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
}

.panel{
  background:#191919;
  border:1px solid #333;
  border-radius:12px;
  padding:11px;
}

.panel h2{
  font-size:14px;
  margin:0 0 8px;
}

.note{
  background:#222;
  border-radius:9px;
  padding:8px;
  font-size:11px;
  line-height:1.55;
  margin:6px 0;
}

.ok{
  color:#91db9a;
}

.bad{
  color:#ff8585;
}

.row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
  font-size:12px;
}

input[type=range]{
  width:100%;
}

select{
  background:#242424;
  color:#eee;
  border:1px solid #555;
  border-radius:7px;
  padding:6px;
}

#status{
  white-space:pre-wrap;
  font-size:11px;
  line-height:1.5;
  color:#bbb;
}

.legend{
  font-size:10px;
  color:#aaa;
  line-height:1.5;
}

@media(max-width:900px){

  main{
    grid-template-columns:1fr;
  }

  .panel{
    order:2;
  }

  .viewer{
    min-height:48vh;
  }
}
</style>
</head>

<body>

<header>

<h1>人体骨架透视检测器 V1.3</h1>

<div class="sub">
核心目标：原图不变，骨架由真实姿态检测结果驱动。
先验证准确叠合，不做比例评分。
</div>

<div class="toolbar">

<label class="file">
打开人物图
<input id="file" type="file" accept="image/*">
</label>

<button id="detect" disabled>
开始检测
</button>

<button id="original" disabled>
原图
</button>

<button id="xr" disabled>
X 光骨架
</button>

<button id="boneOnly" disabled>
仅骨架
</button>

<button id="points" disabled>
显示检测点
</button>

</div>

</header>


<main>

<section class="viewer">

<div id="empty">
先打开一张人物图片
</div>

<div id="stage">

<img id="img" alt="">

<canvas id="overlay"></canvas>

</div>

</section>


<aside class="panel">

<h2>V1.3 检测状态</h2>

<div id="status">
等待图片。
</div>


<div class="note">

<b>本版验收标准</b>

<br>

① 肩、肘、腕、髋、膝、踝必须跟随人物真实姿态。

<br>

② 胸廓、脊柱、骨盆由真实姿态点推导。

<br>

③ 不允许使用固定人体 PNG 强行覆盖。

<br>

④ 明显错位就是检测问题，不通过美化隐藏。

</div>


<div class="row">

<label>人物透明度</label>

<input
  id="photoOpacity"
  type="range"
  min="15"
  max="100"
  value="55">

</div>


<div class="row">

<label>骨架强度</label>

<input
  id="boneOpacity"
  type="range"
  min="20"
  max="100"
  value="90">

</div>


<div class="row">

<label>显示模式</label>

<select id="mode">

<option value="xr">
X 光骨架
</option>

<option value="overlay">
原图 + 骨架
</option>

<option value="bone">
仅骨架
</option>

</select>

</div>


<div class="legend">

注意：

MediaPipe 33点是姿态关键点，
不是医学影像中的真实隐藏骨骼。

肋骨、胸骨、脊柱、颅骨、骨盆，
属于根据姿态点推导出来的可视化结构。

</div>

</aside>

</main>


<script type="module">

const $ = id => document.getElementById(id);

const img = $("img");
const canvas = $("overlay");
const ctx = canvas.getContext("2d");

const stage = $("stage");
const empty = $("empty");
const status = $("status");

let W = 0;
let H = 0;

let landmarks = null;
let detector = null;

let showPoints = false;


/* =========================
   基础工具
========================= */

function statusText(text, cls = ""){

  status.className = cls;
  status.textContent = text;

}


function enableButtons(value){

  [
    "detect",
    "original",
    "xr",
    "boneOnly",
    "points"
  ].forEach(id => {

    $(id).disabled = !value;

  });

}


function P(index){

  return landmarks?.[index] || null;

}


function mid(a,b){

  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };

}


function dist(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function unit(a,b){

  const dx = b.x-a.x;
  const dy = b.y-a.y;

  const d =
    Math.hypot(dx,dy) || 1;

  return {
    x:dx/d,
    y:dy/d
  };

}


function perp(v){

  return {
    x:-v.y,
    y:v.x
  };

}


function lerp(a,b,t){

  return {
    x:a.x+(b.x-a.x)*t,
    y:a.y+(b.y-a.y)*t
  };

}


/* =========================
   绘图工具
========================= */

function capsule(
  a,
  b,
  r1,
  r2,
  fill
){

  const u = unit(a,b);
  const n = perp(u);

  ctx.beginPath();

  ctx.moveTo(
    a.x+n.x*r1,
    a.y+n.y*r1
  );

  ctx.lineTo(
    b.x+n.x*r2,
    b.y+n.y*r2
  );

  ctx.lineTo(
    b.x-n.x*r2,
    b.y-n.y*r2
  );

  ctx.lineTo(
    a.x-n.x*r1,
    a.y-n.y*r1
  );

  ctx.closePath();

  ctx.fillStyle = fill;
  ctx.fill();

}


function line(
  a,
  b,
  width,
  stroke
){

  ctx.beginPath();

  ctx.moveTo(a.x,a.y);

  ctx.lineTo(b.x,b.y);

  ctx.lineWidth = width;

  ctx.strokeStyle = stroke;

  ctx.stroke();

}


function ellipse(
  center,
  rx,
  ry,
  rotation,
  fill,
  stroke=""
){

  ctx.beginPath();

  ctx.ellipse(
    center.x,
    center.y,
    rx,
    ry,
    rotation,
    0,
    Math.PI*2
  );

  ctx.fillStyle = fill;

  ctx.fill();

  if(stroke){

    ctx.lineWidth = 1;

    ctx.strokeStyle = stroke;

    ctx.stroke();

  }

}


function arc(
  center,
  rx,
  ry,
  rotation,
  start,
  end,
  width,
  stroke
){

  ctx.beginPath();

  ctx.ellipse(
    center.x,
    center.y,
    rx,
    ry,
    rotation,
    start,
    end
  );

  ctx.lineWidth = width;

  ctx.strokeStyle = stroke;

  ctx.stroke();

}


/* =========================
   X光式解剖骨架
========================= */

function drawAnatomical(){

  const ls = P(11);
  const rs = P(12);

  const le = P(13);
  const re = P(14);

  const lw = P(15);
  const rw = P(16);

  const lh = P(23);
  const rh = P(24);

  const lk = P(25);
  const rk = P(26);

  const la = P(27);
  const ra = P(28);

  const lf = P(29);
  const rf = P(30);

  const lt = P(31);
  const rt = P(32);

  const lear = P(7);
  const rear = P(8);

  const nose = P(0);


  if(
    !ls ||
    !rs ||
    !lh ||
    !rh
  ){

    return;

  }


  /* =========================
     身体基础
  ========================= */

  const S = mid(ls,rs);
  const G = mid(lh,rh);

  const shoulderW =
    dist(ls,rs);

  const hipW =
    dist(lh,rh);

  const torsoAxis =
    unit(S,G);

  const torsoLength =
    dist(S,G);

  const neck =
    lerp(S,G,.10);

  const sternumEnd =
    lerp(S,G,.56);


  /* =========================
     X光颜色
  ========================= */

  const bone =
    "rgba(232,252,255,.88)";

  const glow =
    "rgba(190,245,255,.90)";

  const inner =
    "rgba(120,225,245,.70)";


  ctx.save();

  ctx.globalAlpha =
    Number(
      $("boneOpacity").value
    ) / 100;

  ctx.shadowBlur = 6;

  ctx.shadowColor =
    "rgba(90,220,255,.50)";


  /* =========================
     头骨
  ========================= */

  const earWidth =
    lear && rear
      ? dist(lear,rear)
      : shoulderW*.18;


  const headCenter =
    lear && rear
      ? mid(lear,rear)
      : nose
        ? {
            x:nose.x,
            y:nose.y-
              shoulderW*.16
          }
        : neck;


  const headDirection =
    lear && rear
      ? unit(lear,rear)
      : {
          x:1,
          y:0
        };


  const headRotation =
    Math.atan2(
      headDirection.y,
      headDirection.x
    );


  ellipse(
    headCenter,

    Math.max(
      earWidth*.75,
      shoulderW*.085
    ),

    Math.max(
      earWidth*.92,
      shoulderW*.11
    ),

    headRotation,

    "rgba(230,252,255,.16)",

    glow
  );


  /* 颅骨内部 */

  ellipse(
    headCenter,

    Math.max(
      earWidth*.38,
      shoulderW*.045
    ),

    Math.max(
      earWidth*.55,
      shoulderW*.065
    ),

    headRotation,

    "rgba(230,252,255,.07)",

    inner
  );


  /* 鼻骨方向 */

  if(nose){

    line(
      lerp(
        headCenter,
        nose,
        .35
      ),
      nose,
      Math.max(
        1.5,
        shoulderW*.012
      ),
      inner
    );

  }


  /* =========================
     锁骨
  ========================= */

  line(
    ls,
    neck,
    Math.max(
      2,
      shoulderW*.018
    ),
    glow
  );


  line(
    neck,
    rs,
    Math.max(
      2,
      shoulderW*.018
    ),
    glow
  );


  /* =========================
     肩胛区域
  ========================= */

  arc(
    S,

    shoulderW*.39,

    shoulderW*.15,

    Math.atan2(
      torsoAxis.y,
      torsoAxis.x
    ),

    Math.PI*.08,

    Math.PI*.92,

    Math.max(
      1.5,
      shoulderW*.012
    ),

    inner
  );


  /* =========================
     肋骨
  ========================= */

  const ribRotation =
    Math.atan2(
      torsoAxis.y,
      torsoAxis.x
    ) + Math.PI/2;


  for(
    let i=0;
    i<6;
    i++
  ){

    const t =
      .22 + i*.085;


    const center =
      lerp(S,G,t);


    const width =
      shoulderW*
      (.42-.075*i);


    const height =
      torsoLength*.052;


    arc(
      center,

      width,

      height,

      ribRotation,

      Math.PI*.08,

      Math.PI*.92,

      Math.max(
        1.4,
        shoulderW*.010
      ),

      inner
    );

  }


  /* =========================
     胸骨
  ========================= */

  line(
    neck,
    sternumEnd,
    Math.max(
      2,
      shoulderW*.016
    ),
    glow
  );


  /* =========================
     脊柱
  ========================= */

  const spine = [];


  for(
    let i=0;
    i<=7;
    i++
  ){

    spine.push(
      lerp(
        S,
        G,
        .10+i*.112
      )
    );

  }


  for(
    let i=0;
    i<spine.length-1;
    i++
  ){

    capsule(
      spine[i],
      spine[i+1],

      Math.max(
        1.2,
        shoulderW*.016
      ),

      Math.max(
        1.1,
        shoulderW*.014
      ),

      bone
    );


    ellipse(
      spine[i],

      Math.max(
        1.2,
        shoulderW*.018
      ),

      Math.max(
        1,
        shoulderW*.014
      ),

      0,

      "rgba(240,255,255,.45)"
    );

  }


  /* =========================
     骨盆
  ========================= */

  const pelvisCenter =
    lerp(S,G,.91);


  arc(
    pelvisCenter,

    hipW*.60,

    torsoLength*.11,

    ribRotation,

    0,

    Math.PI*2,

    Math.max(
      2,
      hipW*.018
    ),

    glow
  );


  line(
    lh,
    rh,
    Math.max(
      2,
      hipW*.018
    ),
    glow
  );


  line(
    lh,
    lerp(lh,G,.55),
    Math.max(
      1.6,
      hipW*.014
    ),
    inner
  );


  line(
    rh,
    lerp(rh,G,.55),
    Math.max(
      1.6,
      hipW*.014
    ),
    inner
  );


  /* =========================
     左臂
  ========================= */

  if(le && lw){

    capsule(
      ls,
      le,

      shoulderW*.040,
      shoulderW*.029,

      bone
    );


    capsule(
      le,
      lw,

      shoulderW*.031,
      shoulderW*.022,

      bone
    );


    ellipse(
      le,

      shoulderW*.030,
      shoulderW*.030,

      0,

      "rgba(240,255,255,.70)"
    );

  }


  /* =========================
     右臂
  ========================= */

  if(re && rw){

    capsule(
      rs,
      re,

      shoulderW*.040,
      shoulderW*.029,

      bone
    );


    capsule(
      re,
      rw,

      shoulderW*.031,
      shoulderW*.022,

      bone
    );


    ellipse(
      re,

      shoulderW*.030,
      shoulderW*.030,

      0,

      "rgba(240,255,255,.70)"
    );

  }


  /* =========================
     左腿
  ========================= */

  if(lk && la){

    capsule(
      lh,
      lk,

      hipW*.048,
      hipW*.034,

      bone
    );


    capsule(
      lk,
      la,

      hipW*.036,
      hipW*.025,

      bone
    );


    ellipse(
      lk,

      hipW*.034,
      hipW*.034,

      0,

      "rgba(240,255,255,.70)"
    );

  }


  /* =========================
     右腿
  ========================= */

  if(rk && ra){

    capsule(
      rh,
      rk,

      hipW*.048,
      hipW*.034,

      bone
    );


    capsule(
      rk,
      ra,

      hipW*.036,
      hipW*.025,

      bone
    );


    ellipse(
      rk,

      hipW*.034,
      hipW*.034,

      0,

      "rgba(240,255,255,.70)"
    );

  }


  /* =========================
     双脚
  ========================= */

  if(lf && lt){

    capsule(
      lf,
      lt,

      hipW*.029,
      hipW*.018,

      bone
    );


    line(
      lf,
      lt,
      Math.max(
        1.5,
        hipW*.014
      ),
      glow
    );

  }


  if(rf && rt){

    capsule(
      rf,
      rt,

      hipW*.029,
      hipW*.018,

      bone
    );


    line(
      rf,
      rt,
      Math.max(
        1.5,
        hipW*.014
      ),
      glow
    );

  }


  ctx.restore();

}


/* =========================
   33点调试显示
========================= */

function drawPoints(){

  if(!landmarks)return;

  ctx.save();

  ctx.globalAlpha=.95;

  landmarks.forEach(p=>{

    if((p.v??1)<.35)return;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      Math.max(
        3,
        W*.0028
      ),
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      (p.v??1)>=.7
      ? "#ff4d5d"
      : "#ffd35c";

    ctx.fill();

  });

  ctx.restore();

}


/* =========================
   画布尺寸
========================= */

function resize(){

  if(!W)return;

  canvas.width=W;
  canvas.height=H;

  canvas.style.width =
    img.clientWidth+"px";

  canvas.style.height =
    img.clientHeight+"px";

  draw();

}


new ResizeObserver(
  resize
).observe(img);


/* =========================
   打开图片
========================= */

$("file").onchange = e => {

  const file =
    e.target.files?.[0];

  if(!file)return;


  const url =
    URL.createObjectURL(file);


  img.onload = () => {

    W=img.naturalWidth;
    H=img.naturalHeight;

    stage.style.display =
      "inline-block";

    empty.style.display =
      "none";


    canvas.width=W;
    canvas.height=H;


    landmarks=null;

    enableButtons(false);

    $("detect").disabled=false;


    img.style.opacity=1;

    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    statusText(
      `图片已载入：${W} × ${H}
点击“开始检测”。`
    );


    URL.revokeObjectURL(url);

    resize();

  };


  img.src=url;

};


/* =========================
   MediaPipe
========================= */

async function createDetector(){

  statusText(
    `正在加载 MediaPipe…
首次加载模型可能需要一点时间。`
  );


  const {
    PoseLandmarker,
    FilesetResolver
  } = await import(
    "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs"
  );


  const vision =
    await FilesetResolver.forVisionTasks(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
    );


  detector =
    await PoseLandmarker.createFromOptions(
      vision,
      {

        baseOptions:{

          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

        },


        runningMode:"IMAGE",

        numPoses:1,

        minPoseDetectionConfidence:.5,

        minPosePresenceConfidence:.5,

        minTrackingConfidence:.5

      }
    );

}


/* =========================
   开始检测
========================= */

$("detect").onclick =
async () => {

  if(!W)return;


  $("detect").disabled=true;


  try{

    if(!detector){

      await createDetector();

    }


    const result =
      detector.detect(img);


    if(!result.landmarks?.length){

      landmarks=null;

      draw();

      enableButtons(false);

      $("detect").disabled=false;


      statusText(
        `❌ 没有检测到人物。
不检测到人物就不画假骨架。`,
        "bad"
      );

      return;

    }


    landmarks =
      result.landmarks[0]
      .map((p,i)=>({

        x:p.x*W,

        y:p.y*H,

        z:p.z,

        v:p.visibility??1,

        i

      }));


    enableButtons(true);


    statusText(
      `✅ 检测完成：1 人物 / 33 个姿态点
骨架由本次检测结果驱动。
重点检查肩、髋、膝、踝与人物轮廓是否吻合。`,
      "ok"
    );


    draw();

  }
  catch(error){

    console.error(error);

    enableButtons(false);

    $("detect").disabled=false;


    statusText(
      "❌ MediaPipe 加载/检测失败：\n"+
      (error?.message || error),
      "bad"
    );

  }
  finally{

    $("detect").disabled=false;

  }

};


/* =========================
   最终绘制
========================= */

function draw(){

  if(!W)return;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(!landmarks){

    img.style.opacity=1;

    return;

  }


  const mode =
    $("mode").value;


  const opacity =
    Number(
      $("photoOpacity").value
    )/100;


  if(mode==="bone"){

    img.style.opacity=0;

  }
  else{

    img.style.opacity=opacity;

  }


  drawAnatomical();


  if(showPoints){

    drawPoints();

  }

}


/* =========================
   控件
========================= */

[
  "photoOpacity",
  "boneOpacity",
  "mode"
].forEach(id=>{

  $(id).addEventListener(
    "input",
    draw
  );

});


$("original").onclick=()=>{

  $("mode").value="overlay";

  $("photoOpacity").value=100;

  draw();

};


$("xr").onclick=()=>{

  $("mode").value="xr";

  $("photoOpacity").value=55;

  draw();

};


$("boneOnly").onclick=()=>{

  $("mode").value="bone";

  draw();

};


$("points").onclick=()=>{

  showPoints=!showPoints;

  $("points").textContent =
    showPoints
      ? "隐藏检测点"
      : "显示检测点";

  draw();

};

</script>

</body>
</html>
