<style>
*{box-sizing:border-box}

body{
  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Segoe UI",sans-serif;

header{
  position:sticky;

#empty{

<body>

<header>

<h1>人体 X 光解剖骨架 V1.8</h1>

<div class="sub">
上传人物图后自动检测 · 33点姿态驱动 · 关节链 · 胸廓 · 脊柱 · 骨盆 · 耻骨参考
</div>

<div class="toolbar">

<label class="file">
打开人物图
<input id="file" type="file" accept="image/*">
</label>

<button id="detect" disabled>
重新检测
</button>

<button id="original" disabled>
原图
</button>

<button id="xr" disabled>
X 光
</button>

<button id="boneOnly" disabled>
仅骨架
</button>

<button id="points" disabled>
检测点
</button>

</div>

</header>


<main>

<section class="viewer">

<div id="empty">
打开人物图片后会自动检测
</div>

<div id="stage">

<img id="img">

<canvas id="overlay"></canvas>

</div>

</section>


<aside class="panel">

<h2>V1.8 骨架检测</h2>

<div id="status">
等待图片。
</div>

<div class="note">

<b>当前开发目标</b><br><br>

上传图片后自动检测人物。<br><br>

骨架必须跟随真实姿态，而不是固定覆盖。<br><br>

重点观察：<br>
肩 → 肘 → 腕<br>
髋 → 膝 → 踝<br>
胸廓 → 脊柱 → 骨盆<br>
骨盆中心 → 耻骨参考

</div>


<div class="row">
<label>人物透明度</label>

<input
  id="photoOpacity"
  type="range"
  min="10"
  max="100"
  value="55">
</div>


<div class="row">
<label>骨架强度</label>

<input
  id="boneOpacity"
  type="range"
  min="20"
  max="100"
  value="90">
</div>


<div class="legend">

白色：主要骨骼<br>
青色：解剖结构参考<br>
红点：高可信姿态点<br>
黄点：较低可信姿态点<br><br>

耻骨区域属于姿态推导参考，
不是 MediaPipe 直接检测出的医学骨点。

</div>

</aside>

</main>


<script type="module">

/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const img = $("img");
const canvas = $("overlay");
const ctx = canvas.getContext("2d");

const stage = $("stage");
const empty = $("empty");
const status = $("status");


/* =========================================================
   全局状态
========================================================= */

let W = 0;
let H = 0;

let landmarks = null;
let detector = null;

let showPoints = false;
let displayMode = "xr";

let mediaPipeLoading = false;


/* =========================================================
   状态
========================================================= */

function setStatus(text, cls=""){

  status.className = cls;
  status.textContent = text;

}


function enableButtons(enabled){

  [
    "original",
    "xr",
    "boneOnly",
    "points"
  ].forEach(id => {

    $(id).disabled = !enabled;

  });

}


/* =========================================================
   数学
========================================================= */

function P(i){

  return landmarks?.[i] || null;

}


function mid(a,b){

  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };

}


function dist(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function unit(a,b){

  const dx = b.x-a.x;
  const dy = b.y-a.y;

  const d = Math.hypot(dx,dy) || 1;

  return {
    x:dx/d,
    y:dy/d
  };

}


function perp(v){

  return {
    x:-v.y,
    y:v.x
  };

}


function add(a,v,s){

  return {
    x:a.x+v.x*s,
    y:a.y+v.y*s
  };

}


function lerp(a,b,t){

  return {
    x:a.x+(b.x-a.x)*t,
    y:a.y+(b.y-a.y)*t
  };

}


/* =========================================================
   绘图基础
========================================================= */

function line(a,b,width,color){

  ctx.beginPath();

  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);

  ctx.lineWidth = width;
  ctx.strokeStyle = color;

  ctx.stroke();

}


function circle(p,r,fill,stroke=""){

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle = fill;
  ctx.fill();

  if(stroke){

    ctx.lineWidth = 1;
    ctx.strokeStyle = stroke;
    ctx.stroke();

  }

}


function ellipse(
  p,
  rx,
  ry,
  rotation,
  fill,
  stroke=""
){

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    rx,
    ry,
    rotation,
    0,
    Math.PI*2
  );

  ctx.fillStyle = fill;
  ctx.fill();

  if(stroke){

    ctx.lineWidth = 1;
    ctx.strokeStyle = stroke;
    ctx.stroke();

  }

}


function capsule(a,b,r1,r2,fill){

  const u = unit(a,b);
  const n = perp(u);

  ctx.beginPath();

  ctx.moveTo(
    a.x+n.x*r1,
    a.y+n.y*r1
  );

  ctx.lineTo(
    b.x+n.x*r2,
    b.y+n.y*r2
  );

  ctx.lineTo(
    b.x-n.x*r2,
    b.y-n.y*r2
  );

  ctx.lineTo(
    a.x-n.x*r1,
    a.y-n.y*r1
  );

  ctx.closePath();

  ctx.fillStyle = fill;
  ctx.fill();

}


function arc(
  p,
  rx,
  ry,
  rotation,
  start,
  end,
  width,
  color
){

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    rx,
    ry,
    rotation,
    start,
    end
  );

  ctx.lineWidth = width;
  ctx.strokeStyle = color;

  ctx.stroke();

}


/* =========================================================
   X 光解剖骨架
========================================================= */

function drawSkeleton(){

  const nose = P(0);

  const earL = P(7);
  const earR = P(8);

  const shoulderL = P(11);
  const shoulderR = P(12);

  const elbowL = P(13);
  const elbowR = P(14);

  const wristL = P(15);
  const wristR = P(16);

  const hipL = P(23);
  const hipR = P(24);

  const kneeL = P(25);
  const kneeR = P(26);

  const ankleL = P(27);
  const ankleR = P(28);

  const heelL = P(29);
  const heelR = P(30);

  const toeL = P(31);
  const toeR = P(32);


  if(
    !shoulderL ||
    !shoulderR ||
    !hipL ||
    !hipR
  ){

    return;

  }


  /* =======================================================
     人体基准
  ======================================================= */

  const S = mid(
    shoulderL,
    shoulderR
  );

  const G = mid(
    hipL,
    hipR
  );

  const shoulderWidth =
    dist(
      shoulderL,
      shoulderR
    );

  const hipWidth =
    dist(
      hipL,
      hipR
    );

  const torsoLength =
    dist(
      S,
      G
    );

  const bodyAxis =
    unit(
      S,
      G
    );

  const sideAxis =
    perp(bodyAxis);

  const rotation =
    Math.atan2(
      bodyAxis.y,
      bodyAxis.x
    );


  const MAIN =
    "rgba(238,253,255,.94)";

  const BRIGHT =
    "rgba(195,249,255,.98)";

  const DETAIL =
    "rgba(100,225,245,.76)";

  const SOFT =
    "rgba(170,245,255,.05)";


  ctx.save();

  ctx.globalAlpha =
    Number(
      $("boneOpacity").value
    ) / 100;

  ctx.shadowBlur = 6;

  ctx.shadowColor =
    "rgba(70,225,255,.55)";


  /* =======================================================
     头骨
  ======================================================= */

  let headCenter;

  if(earL && earR){

    headCenter =
      mid(
        earL,
        earR
      );

  }
  else if(nose){

    headCenter = {
      x:nose.x,
      y:nose.y-shoulderWidth*.15
    };

  }
  else{

    headCenter = {
      x:S.x,
      y:S.y-shoulderWidth*.25
    };

  }


  const headWidth =
    earL && earR
      ? dist(earL,earR)
      : shoulderWidth*.18;


  const headRotation =
    earL && earR
      ? Math.atan2(
          earR.y-earL.y,
          earR.x-earL.x
        )
      : 0;


  ellipse(
    headCenter,
    headWidth*.76,
    headWidth*.98,
    headRotation,
    SOFT,
    BRIGHT
  );


  /*
     面部中线
  */

  if(nose){

    line(
      headCenter,
      nose,
      Math.max(
        1.2,
        shoulderWidth*.009
      ),
      DETAIL
    );

  }


  /* =======================================================
     锁骨
  ======================================================= */

  line(
    shoulderL,
    S,
    Math.max(
      2,
      shoulderWidth*.016
    ),
    BRIGHT
  );

  line(
    S,
    shoulderR,
    Math.max(
      2,
      shoulderWidth*.016
    ),
    BRIGHT
  );


  /* =======================================================
     肩胛区域
  ======================================================= */

  arc(
    shoulderL,
    shoulderWidth*.18,
    shoulderWidth*.27,
    rotation,
    -Math.PI*.65,
    Math.PI*.55,
    Math.max(
      1.2,
      shoulderWidth*.007
    ),
    DETAIL
  );


  arc(
    shoulderR,
    shoulderWidth*.18,
    shoulderWidth*.27,
    rotation,
    Math.PI*.45,
    Math.PI*1.65,
    Math.max(
      1.2,
      shoulderWidth*.007
    ),
    DETAIL
  );


  /* =======================================================
     肱骨
  ======================================================= */

  if(elbowL){

    capsule(
      shoulderL,
      elbowL,
      shoulderWidth*.037,
      shoulderWidth*.026,
      MAIN
    );

  }

  if(elbowR){

    capsule(
      shoulderR,
      elbowR,
      shoulderWidth*.037,
      shoulderWidth*.026,
      MAIN
    );

  }


  /* =======================================================
     前臂
  ======================================================= */

  if(elbowL && wristL){

    capsule(
      elbowL,
      wristL,
      shoulderWidth*.027,
      shoulderWidth*.018,
      MAIN
    );

  }

  if(elbowR && wristR){

    capsule(
      elbowR,
      wristR,
      shoulderWidth*.027,
      shoulderWidth*.018,
      MAIN
    );

  }


  /* 肘 */

  if(elbowL){

    circle(
      elbowL,
      shoulderWidth*.024,
      "rgba(240,255,255,.72)"
    );

  }

  if(elbowR){

    circle(
      elbowR,
      shoulderWidth*.024,
      "rgba(240,255,255,.72)"
    );

  }


  /* =======================================================
     胸廓
  ======================================================= */

  const ribTop =
    lerp(
      S,
      G,
      .10
    );

  const ribBottom =
    lerp(
      S,
      G,
      .60
    );


  /*
     胸廓左右边界
  */

  const chestLeft = [];
  const chestRight = [];


  for(let i=0;i<=7;i++){

    const t =
      i/7;

    const center =
      lerp(
        ribTop,
        ribBottom,
        t
      );


    /*
       从肩部向下逐渐收窄
    */

    const width =
      shoulderWidth *
      (
        .40 -
        t*.075
      );


    chestLeft.push(
      add(
        center,
        sideAxis,
        -width
      )
    );


    chestRight.push(
      add(
        center,
        sideAxis,
        width
      )
    );

  }


  for(let i=0;i<7;i++){

    line(
      chestLeft[i],
      chestLeft[i+1],
      Math.max(
        1.3,
        shoulderWidth*.007
      ),
      DETAIL
    );

    line(
      chestRight[i],
      chestRight[i+1],
      Math.max(
        1.3,
        shoulderWidth*.007
      ),
      DETAIL
    );

  }


  /* =======================================================
     肋骨
  ======================================================= */

  for(let i=0;i<8;i++){

    const t =
      i/7;

    const center =
      lerp(
        ribTop,
        ribBottom,
        t
      );


    const width =
      shoulderWidth *
      (
        .36 -
        t*.055
      );


    const left =
      add(
        center,
        sideAxis,
        -width
      );

    const right =
      add(
        center,
        sideAxis,
        width
      );


    const h =
      torsoLength*.025;


    ctx.beginPath();

    ctx.moveTo(
      left.x,
      left.y
    );

    ctx.quadraticCurveTo(
      center.x,
      center.y-h,
      right.x,
      right.y
    );

    ctx.lineWidth =
      Math.max(
        1.2,
        shoulderWidth*.007
      );

    ctx.strokeStyle = DETAIL;

    ctx.stroke();

  }


  /* =======================================================
     胸骨
  ======================================================= */

  const sternumTop =
    lerp(
      S,
      G,
      .10
    );

  const sternumBottom =
    lerp(
      S,
      G,
      .61
    );


  capsule(
    sternumTop,
    sternumBottom,
    shoulderWidth*.010,
    shoulderWidth*.008,
    MAIN
  );


  /* =======================================================
     脊柱
  ======================================================= */

  const spine = [];


  for(let i=0;i<=13;i++){

    const t =
      .08+i*.068;


    spine.push(
      lerp(
        S,
        G,
        t
      )
    );

  }


  for(let i=0;i<spine.length-1;i++){

    capsule(
      spine[i],
      spine[i+1],
      Math.max(
        1,
        shoulderWidth*.010
      ),
      Math.max(
        .9,
        shoulderWidth*.009
      ),
      MAIN
    );


    circle(
      spine[i],
      Math.max(
        1.2,
        shoulderWidth*.014
      ),
      "rgba(245,255,255,.62)"
    );

  }


  /* =======================================================
     骨盆
  ======================================================= */

  const pelvisCenter =
    mid(
      hipL,
      hipR
    );


  /*
     骨盆上缘
  */

  const pelvisTopL =
    add(
      hipL,
      bodyAxis,
      -hipWidth*.12
    );


  const pelvisTopR =
    add(
      hipR,
      bodyAxis,
      -hipWidth*.12
    );


  line(
    pelvisTopL,
    pelvisTopR,
    Math.max(
      2,
      hipWidth*.016
    ),
    BRIGHT
  );


  /*
     左右髂骨
  */

  const pelvisLowerL =
    add(
      hipL,
      bodyAxis,
      hipWidth*.20
    );


  const pelvisLowerR =
    add(
      hipR,
      bodyAxis,
      hipWidth*.20
    );


  line(
    pelvisTopL,
    pelvisLowerL,
    Math.max(
      2,
      hipWidth*.015
    ),
    BRIGHT
  );


  line(
    pelvisTopR,
    pelvisLowerR,
    Math.max(
      2,
      hipWidth*.015
    ),
    BRIGHT
  );


  /*
     骨盆左右下缘
  */

  const pelvisBottom =
    mid(
      pelvisLowerL,
      pelvisLowerR
    );


  line(
    pelvisLowerL,
    pelvisBottom,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    DETAIL
  );


  line(
    pelvisLowerR,
    pelvisBottom,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    DETAIL
  );


  /*
     骨盆环
  */

  arc(
    pelvisCenter,
    hipWidth*.43,
    torsoLength*.10,
    rotation,
    0,
    Math.PI,
    Math.max(
      1.5,
      hipWidth*.012
    ),
    DETAIL
  );


  /* =======================================================
     骨盆中心
  ======================================================= */

  circle(
    pelvisCenter,
    Math.max(
      2.5,
      hipWidth*.024
    ),
    "rgba(240,255,255,.68)"
  );


  /* =======================================================
     耻骨参考
  ======================================================= */

  const pubic =
    lerp(
      pelvisCenter,
      pelvisBottom,
      .72
    );


  circle(
    pubic,
    Math.max(
      2.5,
      hipWidth*.024
    ),
    "rgba(255,255,255,.92)"
  );


  line(
    pelvisLowerL,
    pubic,
    Math.max(
      1.2,
      hipWidth*.009
    ),
    DETAIL
  );


  line(
    pelvisLowerR,
    pubic,
    Math.max(
      1.2,
      hipWidth*.009
    ),
    DETAIL
  );


  /* =======================================================
     股骨
  ======================================================= */

  if(kneeL){

    capsule(
      hipL,
      kneeL,
      hipWidth*.046,
      hipWidth*.032,
      MAIN
    );

  }


  if(kneeR){

    capsule(
      hipR,
      kneeR,
      hipWidth*.046,
      hipWidth*.032,
      MAIN
    );

  }


  /* =======================================================
     膝
  ======================================================= */

  if(kneeL){

    circle(
      kneeL,
      hipWidth*.030,
      "rgba(240,255,255,.74)"
    );

  }

  if(kneeR){

    circle(
      kneeR,
      hipWidth*.030,
      "rgba(240,255,255,.74)"
    );

  }


  /* =======================================================
     小腿
  ======================================================= */

  if(kneeL && ankleL){

    capsule(
      kneeL,
      ankleL,
      hipWidth*.032,
      hipWidth*.021,
      MAIN
    );

  }


  if(kneeR && ankleR){

    capsule(
      kneeR,
      ankleR,
      hipWidth*.032,
      hipWidth*.021,
      MAIN
    );

  }


  /* =======================================================
     脚
  ======================================================= */

  if(ankleL && toeL){

    capsule(
      ankleL,
      toeL,
      hipWidth*.022,
      hipWidth*.013,
      MAIN
    );

  }
  else if(heelL && toeL){

    capsule(
      heelL,
      toeL,
      hipWidth*.022,
      hipWidth*.013,
      MAIN
    );

  }


  if(ankleR && toeR){

    capsule(
      ankleR,
      toeR,
      hipWidth*.022,
      hipWidth*.013,
      MAIN
    );

  }
  else if(heelR && toeR){

    capsule(
      heelR,
      toeR,
      hipWidth*.022,
      hipWidth*.013,
      MAIN
    );

  }


  ctx.restore();

}


/* =========================================================
   33 点
========================================================= */

function drawPoints(){

  if(!landmarks)return;

  ctx.save();

  landmarks.forEach(p=>{

    if((p.v??1)<.35)return;

    circle(
      p,
      Math.max(
        3,
        W*.0027
      ),
      (p.v??1)>=.7
        ? "rgba(255,77,93,.95)"
        : "rgba(255,211,92,.95)"
    );

  });

  ctx.restore();

}


/* =========================================================
   总绘制
========================================================= */

function draw(){

  if(!W)return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(!landmarks){

    img.style.opacity = 1;

    return;

  }


  if(displayMode==="bone"){

    img.style.opacity = 0;

  }
  else if(displayMode==="original"){

    img.style.opacity = 1;

  }
  else{

    img.style.opacity =
      Number(
        $("photoOpacity").value
      )/100;

  }


  drawSkeleton();


  if(showPoints){

    drawPoints();

  }

}


/* =========================================================
   Canvas 尺寸
========================================================= */

function resizeCanvas(){

  if(!W)return;

  canvas.width = W;
  canvas.height = H;

  canvas.style.width =
    img.clientWidth+"px";

  canvas.style.height =
    img.clientHeight+"px";

  draw();

}


new ResizeObserver(
  resizeCanvas
).observe(img);


/* =========================================================
   MediaPipe
========================================================= */

async function loadMediaPipe(){

  if(detector)return detector;

  if(mediaPipeLoading){

    while(mediaPipeLoading){

      await new Promise(
        resolve=>setTimeout(resolve,100)
      );

    }

    return detector;

  }


  mediaPipeLoading=true;


  try{

    setStatus(
      `正在加载 MediaPipe…
首次加载模型可能需要一点时间。`
    );


    const {
      PoseLandmarker,
      FilesetResolver
    } = await import(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs"
    );


    const vision =
      await FilesetResolver.forVisionTasks(
        "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
      );


    detector =
      await PoseLandmarker.createFromOptions(
        vision,
        {

          baseOptions:{

            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

          },

          runningMode:"IMAGE",

          numPoses:1,

          minPoseDetectionConfidence:.5,

          minPosePresenceConfidence:.5,

          minTrackingConfidence:.5

        }
      );


    return detector;

  }
  finally{

    mediaPipeLoading=false;

  }

}


/* =========================================================
   人物检测
========================================================= */

async function detectPerson(){

  if(!W){

    setStatus(
      "请先打开人物图片。",
      "bad"
    );

    return;

  }


  $("detect").disabled=true;


  try{

    await loadMediaPipe();


    setStatus(
      "正在分析人物姿态……"
    );


    const result =
      detector.detect(img);


    if(
      !result.landmarks ||
      !result.landmarks.length
    ){

      landmarks=null;

      ctx.clearRect(
        0,
        0,
        W,
        H
      );

      enableButtons(false);

      setStatus(
        `❌ 没有检测到人物。

请换一张人物更完整、
尺寸更大、遮挡更少的图片。`,
        "bad"
      );

      return;

    }


    landmarks =
      result.landmarks[0]
      .map((p,i)=>({

        x:p.x*W,
        y:p.y*H,
        z:p.z,
        v:p.visibility ?? 1,
        i

      }));


    displayMode="xr";

    $("photoOpacity").value=55;


    enableButtons(true);


    setStatus(
      `✅ 检测完成：1 人物 / 33 个姿态点

V1.8 X 光骨架已建立。

请检查：
肩 → 肘 → 腕
髋 → 膝 → 踝
胸廓 → 脊柱 → 骨盆
骨盆中心 → 耻骨参考`,
      "ok"
    );


    draw();

  }
  catch(error){

    console.error(error);

    enableButtons(false);

    setStatus(
      "❌ 检测失败：\n\n"+
      (error?.message || error),
      "bad"
    );

  }
  finally{

    $("detect").disabled=false;

  }

}


/* =========================================================
   上传图片
   这里已经改成：
   上传 → 自动检测
========================================================= */

$("file").onchange = e => {

  const file =
    e.target.files?.[0];

  if(!file)return;


  const url =
    URL.createObjectURL(file);


  img.onload = async()=>{

    W = img.naturalWidth;
    H = img.naturalHeight;


    stage.style.display =
      "inline-block";

    empty.style.display =
      "none";


    landmarks=null;

    enableButtons(false);


    /*
       重新开始时保留原图
    */

    displayMode="xr";

    img.style.opacity=1;


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    resizeCanvas();


    setStatus(
      `图片已载入：${W} × ${H}

正在自动检测人物……`
    );


    URL.revokeObjectURL(url);


    /*
       关键：
       上传完成后立即检测
    */

    await detectPerson();

  };


  img.onerror=()=>{

    URL.revokeObjectURL(url);

    setStatus(
      "❌ 图片读取失败，请重新选择图片。",
      "bad"
    );

  };


  img.src=url;

};


/* =========================================================
   手动重新检测
========================================================= */

$("detect").onclick = async()=>{

  await detectPerson();

};


/* =========================================================
   原图
========================================================= */

$("original").onclick=()=>{

  displayMode="original";

  $("photoOpacity").value=100;

  draw();

};


/* =========================================================
   X 光
========================================================= */

$("xr").onclick=()=>{

  displayMode="xr";

  $("photoOpacity").value=55;

  draw();

};


/* =========================================================
   仅骨架
========================================================= */

$("boneOnly").onclick=()=>{

  displayMode="bone";

  draw();

};


/* =========================================================
   检测点
========================================================= */

$("points").onclick=()=>{

  showPoints=!showPoints;

  $("points").textContent =
    showPoints
      ? "隐藏检测点"
      : "检测点";

  draw();

};


/* =========================================================
   滑块
========================================================= */

$("photoOpacity").oninput=draw;

$("boneOpacity").oninput=draw;

</script>
