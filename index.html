<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>自动骨架标注 V1.1</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#f4f4f4;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.box{
  max-width:720px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

.subtitle{
  color:#666;
  line-height:1.6;
  margin-bottom:18px;
}

.status{
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  background:#f5f5f5;
  font-size:16px;
}

.ok{
  color:#187a35;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

.wait{
  color:#777;
}

.controls{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

button,
.fileButton{

  border:0;

  border-radius:10px;

  padding:11px 15px;

  font-size:15px;

  background:#222;

  color:white;

  cursor:pointer;

  display:inline-block;
}

.fileButton{
  background:#1877f2;
}

button:disabled{
  opacity:.45;
}

input[type="file"]{
  display:none;
}


/* =========================================
   透视控制
========================================= */

.opacityPanel{

  padding:14px;

  margin-bottom:16px;

  background:#f7f7f7;

  border-radius:10px;

}

.opacityTitle{

  font-size:15px;

  margin-bottom:9px;

}

.opacityRow{

  display:flex;

  align-items:center;

  gap:10px;

}

#opacitySlider{

  flex:1;

}

#opacityValue{

  width:48px;

  text-align:right;

  font-size:14px;

  color:#555;

}


/* =========================================
   图片查看区域
========================================= */

.viewer{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#111;

  min-height:100px;

  display:flex;

  align-items:center;

  justify-content:center;

}


/*
照片层

opacity 会由 JavaScript 控制
*/

#photo{

  display:block;

  width:100%;

  height:auto;

  max-width:100%;

  transition:opacity .15s ease;

}


/*
Canvas 永远覆盖在照片上面
*/

#canvas{

  position:absolute;

  left:0;

  top:0;

  width:100%;

  height:100%;

  pointer-events:none;

}


.info{

  margin-top:15px;

  padding:14px;

  background:#f7f7f7;

  border-radius:10px;

  line-height:1.7;

  font-size:14px;

}

.hidden{
  display:none;
}


/*
仅骨架模式的背景
*/

.skeletonOnly{

  background:#151515;

}

</style>

</head>


<body>


<div class="box">


<h1>🦴 自动骨架标注 V1.1</h1>


<div class="subtitle">

真实 MediaPipe Pose Landmarker<br>

支持：原图 + 骨架 / 透视骨架 / 仅骨架

</div>


<div
  id="status"
  class="status wait"
>

⏳ 正在加载 MediaPipe…

</div>


<!-- ======================================
     操作按钮
====================================== -->

<div class="controls">


<label
  class="fileButton"
  for="fileInput"
>

📷 选择人物照片

</label>


<input
  id="fileInput"
  type="file"
  accept="image/*"
>


<button
  id="normalButton"
  disabled
>

📷 原图+骨架

</button>


<button
  id="xrayButton"
  disabled
>

👁️ 透视骨架

</button>


<button
  id="skeletonButton"
  disabled
>

🦴 仅骨架

</button>


<button
  id="clearButton"
  disabled
>

清除照片

</button>


</div>


<!-- ======================================
     透视强度
====================================== -->

<div
  id="opacityPanel"
  class="opacityPanel hidden"
>

<div class="opacityTitle">

👁️ 人物透视强度

</div>


<div class="opacityRow">


<input
  id="opacitySlider"
  type="range"
  min="0"
  max="100"
  value="35"
>


<div id="opacityValue">

35%

</div>


</div>

</div>


<!-- ======================================
     图片区域
====================================== -->

<div
  id="viewer"
  class="viewer hidden"
>

<img
  id="photo"
  alt="人物照片"
>

<canvas
  id="canvas"
></canvas>

</div>


<div
  id="info"
  class="info"
>

等待系统初始化……

</div>


</div>



<script type="module">


/*
==================================================
自动骨架标注 V1.1
==================================================

核心：

真实 MediaPipe Pose Landmarker

不使用：

❌ 固定人体坐标
❌ 固定骨架
❌ 人工推测骨架
❌ 上一张照片的数据

新增：

① 原图 + 骨架
② 透视骨架
③ 仅骨架
④ 透视强度控制

==================================================
*/


const BUNDLE_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


const WASM_URL =

"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm";


const MODEL_URL =

"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";



/*
==================================================
页面元素
==================================================
*/

const statusEl =
document.getElementById("status");

const fileInput =
document.getElementById("fileInput");

const normalButton =
document.getElementById("normalButton");

const xrayButton =
document.getElementById("xrayButton");

const skeletonButton =
document.getElementById("skeletonButton");

const clearButton =
document.getElementById("clearButton");

const opacityPanel =
document.getElementById("opacityPanel");

const opacitySlider =
document.getElementById("opacitySlider");

const opacityValue =
document.getElementById("opacityValue");

const viewer =
document.getElementById("viewer");

const photo =
document.getElementById("photo");

const canvas =
document.getElementById("canvas");

const info =
document.getElementById("info");



const ctx =
canvas.getContext("2d");



/*
==================================================
全局变量
==================================================
*/

let PoseLandmarker = null;

let FilesetResolver = null;

let DrawingUtils = null;

let poseLandmarker = null;

let currentResults = null;

let currentImageURL = null;


/*
显示模式：

normal
xray
skeleton

*/

let displayMode =
"normal";


/*
透视模式照片透明度

0 = 完全透明

1 = 完全不透明

*/

let photoOpacity =
0.35;



/*
==================================================
状态
==================================================
*/

function setStatus(
  text,
  type="wait"
){

  statusEl.className =
    "status " + type;

  statusEl.textContent =
    text;

}



/*
==================================================
超时
==================================================
*/

function timeout(ms){

  return new Promise(
    (_, reject) => {

      setTimeout(

        () => reject(
          new Error("连接超时")
        ),

        ms

      );

    }

  );

}



async function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    timeout(ms)

  ]);

}



/*
==================================================
MediaPipe 初始化
==================================================
*/

async function initMediaPipe(){

  try{

    setStatus(
      "⏳ 正在加载 MediaPipe Bundle…"
    );


    const vision =

      await withTimeout(

        import(BUNDLE_URL),

        30000

      );


    PoseLandmarker =
      vision.PoseLandmarker;

    FilesetResolver =
      vision.FilesetResolver;

    DrawingUtils =
      vision.DrawingUtils;


    if(
      !PoseLandmarker ||
      !FilesetResolver ||
      !DrawingUtils
    ){

      throw new Error(
        "MediaPipe 组件不完整"
      );

    }


    setStatus(
      "⏳ 正在初始化 WASM…"
    );


    const fileset =

      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        30000

      );


    setStatus(
      "⏳ 正在创建 Pose Landmarker…"
    );


    poseLandmarker =

      await withTimeout(

        PoseLandmarker.createFromOptions(

          fileset,

          {

            baseOptions:{

              modelAssetPath:
                MODEL_URL

            },

            runningMode:
              "IMAGE",

            numPoses:
              1,

            minPoseDetectionConfidence:
              0.5,

            minPosePresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        ),

        120000

      );


    setStatus(
      "✅ MediaPipe Pose 已准备完成",
      "ok"
    );


    info.innerHTML =

      "系统状态：<b>准备完成</b><br>" +

      "检测模式：单人物 / IMAGE<br>" +

      "检测器：Google MediaPipe Pose Landmarker<br>" +

      "等待上传人物照片。";


    normalButton.disabled =
      false;

    xrayButton.disabled =
      false;

    skeletonButton.disabled =
      false;

    clearButton.disabled =
      false;


  }catch(error){

    console.error(error);


    setStatus(
      "❌ MediaPipe 初始化失败",
      "error"
    );


    info.innerHTML =

      "错误信息：<br>" +

      String(
        error.message || error
      ) +

      "<br><br>" +

      "请把错误截图给师傅。";

  }

}



/*
==================================================
上传图片
==================================================
*/

fileInput.addEventListener(
  "change",
  handleFile
);



function handleFile(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  if(!poseLandmarker){

    info.textContent =
      "Pose Landmarker 尚未准备完成。";

    return;

  }


  /*
  清除旧数据
  */

  currentResults =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  释放旧图片 URL
  */

  if(currentImageURL){

    URL.revokeObjectURL(
      currentImageURL
    );

  }


  currentImageURL =
    URL.createObjectURL(file);


  photo.onload =
    () => {

      viewer.classList.remove(
        "hidden"
      );


      viewer.classList.remove(
        "skeletonOnly"
      );


      /*
      Canvas 使用原始图片尺寸
      */

      canvas.width =
        photo.naturalWidth;

      canvas.height =
        photo.naturalHeight;


      /*
      每张新照片默认回到
      原图 + 骨架
      */

      displayMode =
        "normal";


      photo.style.opacity =
        "1";


      opacityPanel.classList.add(
        "hidden"
      );


      info.innerHTML =
        "⏳ 正在检测人物…";


      detectPose();

    };


  photo.src =
    currentImageURL;

}



/*
==================================================
实际检测
==================================================
*/

function detectPose(){

  try{

    /*
    MediaPipe 实际检测
    */

    currentResults =
      poseLandmarker.detect(
        photo
      );


    console.log(
      "MediaPipe Results:",
      currentResults
    );


    /*
    没有人
    */

    if(
      !currentResults ||
      !currentResults.landmarks ||
      currentResults.landmarks.length === 0
    ){

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      info.innerHTML =

        "❌ <b>没有检测到人物</b><br><br>" +

        "系统没有绘制任何骨架。";


      return;

    }


    /*
    单人物
    */

    const landmarks =
      currentResults.landmarks[0];


    /*
    默认显示
    */

    drawSkeleton(
      landmarks
    );


    info.innerHTML =

      "✅ <b>检测到人物</b><br><br>" +

      "检测人体数量：1<br>" +

      "Pose Landmark 数量：" +
      landmarks.length +
      "<br><br>" +

      "当前模式：原图 + 骨架<br><br>" +

      "红点 = MediaPipe 实际检测点<br>" +

      "绿线 = MediaPipe 骨架连接关系";


  }catch(error){

    console.error(error);


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    info.innerHTML =

      "❌ <b>人物检测失败</b><br><br>" +

      String(
        error.message || error
      );

  }

}



/*
==================================================
绘制骨架
==================================================
*/

function drawSkeleton(
  landmarks
){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(displayMode === "skeleton"){

    viewer.classList.add(
      "skeletonOnly"
    );

  }else{

    viewer.classList.remove(
      "skeletonOnly"
    );

  }


  /*
  MediaPipe DrawingUtils
  */

  const drawingUtils =
    new DrawingUtils(ctx);


  /*
  连接线
  */

  drawingUtils.drawConnectors(

    landmarks,

    PoseLandmarker.POSE_CONNECTIONS,

    {

      color:"#00FF00",

      lineWidth:4

    }

  );


  /*
  检测点
  */

  drawingUtils.drawLandmarks(

    landmarks,

    {

      color:"#FF0000",

      fillColor:"#FF0000",

      lineWidth:2,

      radius:5

    }

  );

}



/*
==================================================
显示模式
==================================================
*/


/*
① 原图 + 骨架
*/

normalButton.addEventListener(

  "click",

  () => {

    if(!currentResults){

      return;

    }


    displayMode =
      "normal";


    photo.style.opacity =
      "1";


    opacityPanel.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "skeletonOnly"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "✅ <b>原图 + 骨架</b><br><br>" +

      "人物照片：100%<br>" +

      "骨架：真实 MediaPipe 33 点";

  }

);



/*
② 透视骨架
*/

xrayButton.addEventListener(

  "click",

  () => {

    if(!currentResults){

      return;

    }


    displayMode =
      "xray";


    viewer.classList.remove(
      "skeletonOnly"
    );


    photo.style.opacity =
      photoOpacity;


    opacityPanel.classList.remove(
      "hidden"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "👁️ <b>透视骨架模式</b><br><br>" +

      "人物照片透明度：" +

      Math.round(
        photoOpacity * 100
      ) +

      "%<br>" +

      "骨架保持清晰。<br><br>" +

      "这是显示层变化，" +

      "检测数据没有改变。";

  }

);



/*
③ 仅骨架
*/

skeletonButton.addEventListener(

  "click",

  () => {

    if(!currentResults){

      return;

    }


    displayMode =
      "skeleton";


    photo.style.opacity =
      "0";


    opacityPanel.classList.add(
      "hidden"
    );


    viewer.classList.add(
      "skeletonOnly"
    );


    drawSkeleton(
      currentResults.landmarks[0]
    );


    info.innerHTML =

      "🦴 <b>仅骨架模式</b><br><br>" +

      "人物照片：隐藏<br>" +

      "显示：MediaPipe 实际检测到的 Landmark<br>" +

      "数量：" +

      currentResults.landmarks[0].length;

  }

);



/*
==================================================
透视强度滑块
==================================================
*/

opacitySlider.addEventListener(

  "input",

  () => {

    const value =
      Number(
        opacitySlider.value
      );


    photoOpacity =
      value / 100;


    opacityValue.textContent =
      value + "%";


    if(displayMode === "xray"){

      photo.style.opacity =
        photoOpacity;

    }

  }

);



/*
==================================================
清除
==================================================
*/

clearButton.addEventListener(

  "click",

  () => {

    currentResults =
      null;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if(currentImageURL){

      URL.revokeObjectURL(
        currentImageURL
      );

      currentImageURL =
        null;

    }


    photo.removeAttribute(
      "src"
    );


    viewer.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "skeletonOnly"
    );


    opacityPanel.classList.add(
      "hidden"
    );


    fileInput.value =
      "";


    displayMode =
      "normal";


    photo.style.opacity =
      "1";


    info.innerHTML =
      "等待上传人物照片。";

  }

);



/*
==================================================
启动
==================================================
*/

initMediaPipe();


</script>

</body>

</html>
