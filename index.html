<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediaPipe 检测点连接测试</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
  font-size:23px;
  margin-top:0;
}

.item{
  padding:14px;
  margin:10px 0;
  background:#f7f7f7;
  border-radius:10px;
  font-size:17px;
}

.wait{
  color:#777;
}

.ok{
  color:#16803c;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

#detail{
  margin-top:18px;
  padding:14px;
  background:#fafafa;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>🦴 MediaPipe 检测点连接测试</h1>

<p>
这一版只测试连接，不检测人物，不画骨架。
</p>

<div id="bundle" class="item wait">
① MediaPipe Bundle：检测中…
</div>

<div id="wasm" class="item wait">
② WASM 运行环境：等待…
</div>

<div id="model" class="item wait">
③ Pose Landmarker 模型：等待…
</div>

<div id="points" class="item wait">
④ 33 点检测系统：等待…
</div>

<div id="detail">
正在初始化……
</div>

</div>


<script type="module">

/*
==================================================
MediaPipe 基础连接测试
V0.1
==================================================

这一步只验证：

1. Bundle
2. WASM
3. Pose Landmarker
4. 33 点检测系统

暂时不上传图片。
暂时不画骨架。
*/


/*
==================================================
① MediaPipe Bundle
==================================================

这里改用 0.10.21 + UNPKG。
*/

const BUNDLE_URL =
"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";


/*
==================================================
② WASM
==================================================
*/

const WASM_URL =
"https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm";


/*
==================================================
③ Pose 模型
==================================================
*/

const MODEL_URL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";


const bundleEl =
document.getElementById("bundle");

const wasmEl =
document.getElementById("wasm");

const modelEl =
document.getElementById("model");

const pointsEl =
document.getElementById("points");

const detailEl =
document.getElementById("detail");


function setOK(element,text){

  element.className =
    "item ok";

  element.textContent =
    "✅ " + text;

}


function setError(element,text){

  element.className =
    "item error";

  element.textContent =
    "❌ " + text;

}


function setWait(element,text){

  element.className =
    "item wait";

  element.textContent =
    "⏳ " + text;

}


function timeout(ms){

  return new Promise(
    function(_,reject){

      setTimeout(
        function(){

          reject(
            new Error("连接超时")

          );

        },
        ms
      );

    }
  );

}


async function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    timeout(ms)

  ]);

}


async function startTest(){

  let PoseLandmarker;

  let FilesetResolver;


  /*
  ==================================================
  TEST ①
  MediaPipe Bundle
  ==================================================
  */

  try{

    setWait(
      bundleEl,
      "MediaPipe Bundle：正在连接…"
    );


    const vision =
      await withTimeout(

        import(BUNDLE_URL),

        20000

      );


    PoseLandmarker =
      vision.PoseLandmarker;

    FilesetResolver =
      vision.FilesetResolver;


    if(
      !PoseLandmarker ||
      !FilesetResolver
    ){

      throw new Error(
        "Bundle 已加载，但没有找到 PoseLandmarker 或 FilesetResolver"
      );

    }


    setOK(
      bundleEl,
      "MediaPipe Bundle：连接成功"
    );


    detailEl.textContent =
      "① Bundle 成功。现在测试 WASM…";


  }catch(error){

    setError(
      bundleEl,
      "MediaPipe Bundle：连接失败"
    );


    detailEl.textContent =
      "Bundle 错误：" +
      (error.message || error);


    return;

  }


  /*
  ==================================================
  TEST ②
  WASM
  ==================================================
  */

  let visionFiles;


  try{

    setWait(
      wasmEl,
      "WASM 运行环境：正在连接…"
    );


    visionFiles =
      await withTimeout(

        FilesetResolver.forVisionTasks(
          WASM_URL
        ),

        20000

      );


    if(!visionFiles){

      throw new Error(
        "WASM 没有返回运行环境"
      );

    }


    setOK(
      wasmEl,
      "WASM 运行环境：连接成功"
    );


    detailEl.textContent =
      "② WASM 成功。现在加载 Pose Landmarker…";


  }catch(error){

    setError(
      wasmEl,
      "WASM 运行环境：连接失败"
    );


    setError(
      modelEl,
      "Pose Landmarker：尚未测试"
    );


    setError(
      pointsEl,
      "33 点检测系统：尚未建立"
    );


    detailEl.textContent =
      "WASM 错误：" +
      (error.message || error);


    return;

  }


  /*
  ==================================================
  TEST ③
  Pose Landmarker
  ==================================================
  */

  try{

    setWait(
      modelEl,
      "Pose Landmarker 模型：正在加载…"
    );


    const landmarker =
      await withTimeout(

        PoseLandmarker.createFromOptions(

          visionFiles,

          {

            baseOptions:{

              modelAssetPath:
                MODEL_URL

            },

            runningMode:
              "IMAGE",

            numPoses:
              1,

            minPoseDetectionConfidence:
              0.5,

            minPosePresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        ),

        30000

      );


    if(!landmarker){

      throw new Error(
        "Pose Landmarker 创建失败"
      );

    }


    setOK(
      modelEl,
      "Pose Landmarker 模型：连接成功"
    );


    /*
    ==================================================
    TEST ④
    33 点检测系统
    ==================================================

    Pose Landmarker 成功创建，
    说明真正的 Pose 检测系统已经建立。

    标准 Pose Landmarker 返回 33 个 landmarks。
    */


    setOK(
      pointsEl,
      "33 点检测系统：已建立"
    );


    detailEl.innerHTML =

      "<b>🎉 基础连接测试通过</b>" +

      "<br><br>" +

      "MediaPipe Bundle：OK" +

      "<br>" +

      "WASM：OK" +

      "<br>" +

      "Pose Landmarker：OK" +

      "<br>" +

      "33 点检测系统：OK" +

      "<br><br>" +

      "下一步再接人物照片检测。";


  }catch(error){

    setError(
      modelEl,
      "Pose Landmarker 模型：加载失败"
    );


    setError(
      pointsEl,
      "33 点检测系统：尚未建立"
    );


    detailEl.textContent =
      "Pose 模型错误：" +
      (error.message || error);


    return;

  }

}


/*
==================================================
开始
==================================================
*/

startTest();

</script>

</body>
</html>
